<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SV MOBILE 운영자 주문</title>
<style>body{font:16px system-ui;margin:32px auto;max-width:1100px;padding:16px;background:#0d211b;color:#edf9f1}h1{font-size:28px}input,button{padding:12px;margin:4px;border-radius:8px;border:1px solid #64776a}button{background:#c4ed77;color:#142b20;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{text-align:left;border-bottom:1px solid #3d5447;padding:12px}p{line-height:1.6;color:#c2d3c8}#status{white-space:pre-wrap}a{color:#c4ed77}</style>
<h1>SV MOBILE · 주문 및 매출 확인</h1><p>연결 이후 서버에서 확인한 최근 500개 주문입니다. 금액·환불·개발자 수익은 Google 주문 API 원본을 조회합니다. 정산 내역은 <a href="https://play.google.com/console/" target="_blank" rel="noopener">Play Console</a>에서 확인하세요.</p>
<form id="login"><input id="email" type="email" autocomplete="username" placeholder="운영자 이메일" required><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required><button>로그인</button></form><button id="refresh" hidden>새로고침</button><button id="logout" hidden>로그아웃</button><p id="status">운영자 계정으로 로그인하세요.</p>
<div style="overflow:auto"><table><thead><tr><th>주문 번호</th><th>주문 상태</th><th>결제 금액</th><th>개발자 수익</th><th>환불 기록</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
let token='';const $=id=>document.getElementById(id);
const money=m=>m?new Intl.NumberFormat('ko-KR',{style:'currency',currency:m.currencyCode}).format(Number(m.units||0)+Number(m.nanos||0)/1e9):'Google 정보 없음';
async function load(){try{const r=await fetch('/v1/admin/orders',{headers:{Authorization:'Bearer '+token}}),data=await r.json();if(!r.ok)throw Error(data.detail||'조회 실패');$('rows').replaceChildren();for(const item of data.orders){const o=item.googleOrder||{},tr=document.createElement('tr');for(const value of [item.order_id,o.state||'정보 없음',money(o.total),money(o.developerRevenueInBuyerCurrency),JSON.stringify(o.orderHistory||{})]){const td=document.createElement('td');td.textContent=value;tr.append(td);}$('rows').append(tr);}$('status').textContent=data.orders.length+'개 주문 · '+new Date().toLocaleString('ko-KR')+' 조회';}catch(e){$('status').textContent=e.message;}}
$('login').onsubmit=async e=>{e.preventDefault();try{const c=await(await fetch('/v1/auth-config')).json();if(!c.apiKey)throw Error('계정 인증 연결이 필요합니다.');const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(c.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,returnSecureToken:true})}),data=await r.json();$('password').value='';if(!r.ok)throw Error('로그인 실패');token=data.idToken;$('login').hidden=true;$('refresh').hidden=$('logout').hidden=false;await load();}catch(e){$('status').textContent=e.message;}};
$('refresh').onclick=load;$('logout').onclick=()=>{token='';$('rows').replaceChildren();$('login').hidden=false;$('refresh').hidden=$('logout').hidden=true;$('status').textContent='로그아웃했습니다.';};
</script>
<h2>계정 삭제 요청 접수 내역</h2>
<p>이 목록은 접수 내역입니다. 계정·영상 삭제나 구독 취소를 실행하지 않습니다.</p>
<button id="deletionRefresh">삭제 요청 조회</button><p id="deletionStatus" role="status"></p>
<div style="overflow:auto"><table><thead><tr><th>접수 번호</th><th>계정 UID</th><th>요청 시각</th><th>처리 상태</th></tr></thead><tbody id="deletionRows"></tbody></table></div>
<script>
$('deletionRefresh').onclick=async()=>{
 try{
  if(!token)throw Error('운영자 계정으로 먼저 로그인하세요.');
  const response=await fetch('/v1/admin/account-deletion-requests',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),result=await response.json();
  if(!response.ok)throw Error(result.detail||'조회 실패');
  $('deletionRows').replaceChildren();
  for(const item of result.requests){const tr=document.createElement('tr');for(const value of [item.requestId,item.uid,item.requestedAt,item.status==='RECEIVED'?'접수 · 처리 대기':item.status]){const td=document.createElement('td');td.textContent=value;tr.append(td);}$('deletionRows').append(tr);}
  $('deletionStatus').textContent=result.requests.length+'개 접수 · 실제 삭제 완료 여부는 별도 확인이 필요합니다.';
 }catch(error){$('deletionStatus').textContent=error.message;}
};
$('logout').addEventListener('click',()=>{$('deletionRows').replaceChildren();$('deletionStatus').textContent='';});
</script></html>
