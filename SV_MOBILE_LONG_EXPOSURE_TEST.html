<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07140f">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>T.UP SV MOBILE | 스윙 분석</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07140f;color:#f4f7f5;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}
.panel{background:#0d2118;border:1px solid #29463a;border-radius:16px;padding:11px;margin:8px 0}
h1{margin:0 0 5px}
.sub,.status{color:#bdd0c6}
.stage{position:relative;height:min(58vh,640px);background:#000;border-radius:12px;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:72px;font-weight:900;background:rgba(0,0,0,.14);text-shadow:0 3px 12px #000}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
button{height:32px;padding:3px 11px;border:0;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;line-height:1}
button:disabled{opacity:.4}
.white{background:#f4f6f5}.green{background:#28714d;color:white}.dark{background:#34493f;color:white}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}
.stat{background:#10291e;padding:12px;border-radius:10px;text-align:center}
.label{color:#bdd0c6}.num{font-size:25px;font-weight:900}
.state{font-size:24px;font-weight:900;margin-top:11px}
.wait{color:#e8d38a}.ready{color:#8fe0ad}.impact{color:#ffb36b}.done{color:#9bd6ff}
#replay{display:none}
#replayCanvas{position:absolute;inset:0;width:100%;height:100%;background:#000}
.note{font-size:14px;color:#9eb5aa;margin-top:8px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}#overlay{font-size:48px}}

#replay{display:none}

</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  max-height:none!important;
  transform:translate(-50%,-50%) rotate(90deg)!important;
  transform-origin:center center!important;
  object-fit:contain!important;
  z-index:1!important;
  background:#000!important;
}
#view{
  z-index:2!important;
  pointer-events:none!important;
  background:transparent!important;
}
#overlay{z-index:3!important}
</style>


<style id="svLeftLiveRightReplayFix">
#liveStage{
  position:relative!important;
  overflow:hidden!important;
  background:#000!important;
}
#liveStage #raw{

  position:absolute!important;
  left:50%!important;
  top:50%!important;
  width:auto!important;
  height:auto!important;
  max-width:none!important;
  max-height:none!important;

}

<style id="svV121DualReplayUI">
html,body{width:100%!important;height:100%!important;overflow:hidden!important}
body{background:#06140e!important}
.wrap{
  width:100%!important;max-width:none!important;height:100vh!important;
  margin:0!important;padding:4px!important;
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
  grid-template-rows:auto minmax(0,1fr)!important;
  gap:4px!important;
  overflow:hidden!important;
}

/* 기존 제목은 공간 확보를 위해 숨김 */
.wrap>h1,.wrap>.sub{display:none!important}

/* LIVE는 화면에 표시하지 않고, 카메라/감지 제어만 상단 얇은 바에 남김 */
#svLivePanel{
  grid-column:1 / -1!important;grid-row:1!important;
  margin:0!important;padding:3px 5px!important;
  min-height:34px!important;
  display:block!important;
  background:#0b2016!important;
  border-radius:9px!important;
}
#svLivePanel #liveStage,
#svLivePanel .stats,
#svLivePanel .state,
#svLivePanel .status,
#svLivePanel .note{display:none!important}
#svLivePanel>.controls{
  display:flex!important;align-items:center!important;justify-content:center!important;
  flex-wrap:nowrap!important;gap:4px!important;margin:0!important;
}
#svLivePanel button,#svLivePanel select{height:28px!important;font-size:11px!important;padding:2px 7px!important}
.camTag{font-size:11px;font-weight:900;color:#8fe0ad;margin-left:4px}

/* 정면/측면 REPLAY = 정확히 50:50 */
#svReplayPanel,#svSideReplayPanel{
  grid-row:2!important;
  width:100%!important;min-width:0!important;height:100%!important;
  margin:0!important;padding:4px!important;
  display:grid!important;
  grid-template-rows:auto minmax(0,1fr) auto auto auto!important;
  background:#0b2016!important;border:1px solid #29463a!important;border-radius:10px!important;
  overflow:hidden!important;
}
#svReplayPanel{grid-column:1!important}
#svSideReplayPanel{grid-column:2!important}
.dualTitle{
  height:28px;display:flex;align-items:center;justify-content:space-between;
  margin:0 0 3px 0;padding:0 5px;
  color:#ecf7f1;font-size:14px;font-weight:900;
}
.dualTitle .camBadge{color:#8fe0ad;font-size:11px}

/* 최대 화면: 컨트롤을 제외한 남은 높이를 영상에 전부 사용 */
.dualStage,#mainVideoStage{
  position:relative!important;
  width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;
  margin:0!important;padding:0!important;
  overflow:hidden!important;background:#000!important;border-radius:7px!important;
}
#mainVideoStage #replayCanvas,#sideReplayCanvas{
  position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;
  display:block!important;background:#000!important;
}
#frontJointCanvas,#sideJointCanvas{
  position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;
  z-index:5!important;pointer-events:none!important;
}
#sideReplay{display:none!important}

#svReplayPanel .controls,#svSideReplayPanel .controls{
  display:flex!important;align-items:center!important;justify-content:center!important;
  flex-wrap:nowrap!important;gap:3px!important;margin-top:3px!important;
}
#svReplayPanel button,#svReplayPanel select,
#svSideReplayPanel button,#svSideReplayPanel select{
  height:28px!important;min-height:28px!important;padding:2px 7px!important;font-size:10px!important;
}
.jointOn{background:#1f8d55!important;color:#fff!important;box-shadow:0 0 0 1px #71d49b inset!important}
.seekRow{display:flex;align-items:center;gap:5px;margin-top:3px!important;height:22px}
.seekRow .status{font-size:9px!important}
.seekRow input{height:16px}
#result,#sideResult{font-size:9px!important;line-height:1.1!important;min-height:12px!important;margin-top:1px!important}

/* 작은 PC 창에서도 50:50 유지 */
@media(max-width:900px){
  .wrap{grid-template-columns:1fr 1fr!important}
  #svReplayPanel button,#svReplayPanel select,
  #svSideReplayPanel button,#svSideReplayPanel select{font-size:9px!important;padding:2px 4px!important}
}
/* 휴대폰만 세로 */
@media(max-width:620px){
  html,body{overflow:auto!important}
  .wrap{height:auto!important;display:block!important}
  #svLivePanel{position:sticky;top:0;z-index:20}
  #svReplayPanel,#svSideReplayPanel{height:78vh!important;margin:4px 0!important}
}
</style>


<style id="svV122AutoLayout">
/* V12.2
   기본: 카메라 1대 = 정면 REPLAY 1화면 전체
   CAM2 실제 연결 성공 = 정면/측면 REPLAY 50:50
*/
.wrap{
  grid-template-columns:minmax(0,1fr)!important;
}
#svReplayPanel{
  grid-column:1!important;
}
#svSideReplayPanel{
  display:none!important;
}

/* CAM2가 실제 연결된 경우에만 5:5 */
.wrap.dual-camera-active{
  grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
}
.wrap.dual-camera-active #svReplayPanel{
  grid-column:1!important;
}
.wrap.dual-camera-active #svSideReplayPanel{
  display:grid!important;
  grid-column:2!important;
}

/* 1카메라 모드에서는 정면 리플레이를 최대 폭/높이로 */
.wrap:not(.dual-camera-active) #svReplayPanel{
  width:100%!important;
  max-width:none!important;
}
.wrap:not(.dual-camera-active) #mainVideoStage{
  width:100%!important;
  height:100%!important;
}

/* 휴대폰: 1카메라면 한 화면 크게.
   2카메라가 실제 연결된 경우만 2화면으로 표시 */
@media(max-width:620px){
  .wrap{
    display:grid!important;
    grid-template-columns:minmax(0,1fr)!important;
    height:100vh!important;
    overflow:hidden!important;
  }
  .wrap:not(.dual-camera-active) #svReplayPanel{
    height:calc(100vh - 44px)!important;
    margin:0!important;
  }
  .wrap:not(.dual-camera-active) #mainVideoStage{
    min-height:0!important;
  }

  .wrap.dual-camera-active{
    display:grid!important;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
    height:100vh!important;
  }
  .wrap.dual-camera-active #svReplayPanel,
  .wrap.dual-camera-active #svSideReplayPanel{
    height:calc(100vh - 44px)!important;
    margin:0!important;
  }
}

/* CAM2가 없을 때 측면 선택 UI도 감춤 */
#sideCamUiTag,#sideCameraSelect{display:none}
.wrap.side-camera-available #sideCamUiTag,
.wrap.side-camera-available #sideCameraSelect{display:inline-flex}
</style>

}

</style>

<body>
<div class="wrap">
<h1>SV · Pose Swing Test V13.0 START EXIT</h1>
<div class="sub">V11.1B 감지부 고정 · 최근 스윙 반복 · 재생/정지 · 배속 · 프레임 이동</div>

<div class="panel" id="svLivePanel">
<div class="stage" id="liveStage">
  <video id="raw" autoplay playsinline muted></video>
  <canvas id="view"></canvas>
  <div id="overlay">READY</div>
</div>

<div class="controls">
  <select id="cameraSelect" class="white" title="카메라 선택" style="max-width:180px">
<option value="">기본 카메라 (전면)</option>
</select>
<button id="connect" class="white">카메라 연결</button>
  <button id="arm" class="green" disabled>스윙감지 ON</button>
  <button id="disconnect" class="dark" disabled>카메라 해제</button>
<button id="liveViewBtn" class="white">LIVE 보기</button>
<button id="exitBtn" class="dark" type="button">종료</button>
</div>

<div class="stats">
  <div class="stat"><div class="label">사람 상태</div><div id="presence" class="num">대기</div></div>
  <div class="stat"><div class="label">관절 안정도</div><div id="stable" class="num">0.00</div></div>
  <div class="stat"><div class="label">양손 상대속도</div><div id="wristSpeed" class="num">0.00</div></div>
  <div class="stat"><div class="label">ADDRESS LOCK</div><div id="addressState" class="num">OFF</div></div><div class="stat"><div class="label">스윙 상태</div><div id="swingState" class="num">대기</div></div>
</div>

<div id="state" class="state wait">대기</div>
<div id="status" class="status">카메라를 연결하세요.</div>
<div class="note">※ 이번 V9는 SV 독립 로직입니다. 외부 프로그램의 코드나 통신을 사용하지 않습니다.</div>
</div>

<div class="panel" id="svReplayPanel">
<div class="sub">최근 정상 스윙 반복 리플레이 · 90° 보정</div>
<div class="stage" id="mainVideoStage" style="height:min(56vh,610px)">
  <canvas id="replayCanvas"></canvas>
</div>
<video id="replay" playsinline loop muted></video>
<div class="controls">
  <button id="frontJointBtn" class="dark" disabled>관절보기 OFF</button>
  <button id="replayPause" class="dark" disabled>일시정지</button>
  <button id="sendA" class="green" disabled>A화면 보내기</button>
  <button id="sendB" class="green" disabled>B화면 보내기</button>
  <button id="replayPlay" class="white" disabled>재생</button>

  <button id="frameNext" class="white" disabled>1프레임 ▶</button>

<script>
const $=id=>document.getElementById(id);
const raw=$('raw'), view=$('view'), ctx=view.getContext('2d');
const poseInput=document.createElement('canvas'), poseInputCtx=poseInput.getContext('2d');
const replay=$('replay'), replayCanvas=$('replayCanvas'), rctx=replayCanvas.getContext('2d');

let stream=null, pose=null, armed=false, processing=false, raf=null;
let recorder=null, chunks=[], recording=false;
let latestReplayBlob=null;
let ready=false, readyAt=0, stableSince=0, swingStarted=false, swingStartAt=0, addressLocked=false;
let lastPose=null, lastPoseTime=0, lastWristSpeed=0;
let latestLandmarks=null, cooldown=false;

const STABLE_MS=850;
const READY_BEEP_DELAY=300;
const SWING_HAND_SPEED=0.16;
const SWING_SHOULDER_TURN=0.015;
const MAX_PELVIS_SPEED=0.055;
const MAX_ANKLE_SPEED=0.05;
const SWING_CAPTURE_MS=3200;
 // Auto-adaptive ADDRESS confirmation: tolerate short landmark dropouts,
 // but require repeated real frames and recent low-motion evidence.
 let svAddressCandidateSince=0,svAddressLastGood=0,svAddressGoodFrames=0,svAddressTotalFrames=0;
 let svAddressMotionEMA=null,svAddressLastFrame=0,svAddressAnchorHip=null,svAddressAnchorAnkle=null;
 const SV_ADDRESS_GAP_MS=180,SV_ADDRESS_MIN_GOOD_FRAMES=6;
 function svResetAddressCandidate(){
   svAddressCandidateSince=0;svAddressLastGood=0;svAddressGoodFrames=0;svAddressTotalFrames=0;svAddressMotionEMA=null;svAddressAnchorHip=null;svAddressAnchorAnkle=null;
 }


function tone(freq=880,d=.14){
  try{
    const a=new(window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.value=.13;
    o.start();o.stop(a.currentTime+d);
  }catch(e){}
}

function dist(a,b){
  const dx=a.x-b.x,dy=a.y-b.y;
  return Math.hypot(dx,dy);
}

function personVisible(lm){
  if(!lm || lm.length<25) return false;
  // 사람 존재 표시는 상체+골반만으로도 인정한다.
  // 실제 ADDRESS LOCK/스윙 판정은 기존 하체 조건을 그대로 사용한다.
  const core=[11,12,13,14,15,16,23,24];
  return core.filter(i=>(lm[i]?.visibility||0)>0.35).length>=5;
}

function poseMotionMetrics(lm, now){
  if(!lastPose || !lastPoseTime){
    lastPose=lm.map(p=>({x:p.x,y:p.y}));
    lastPoseTime=now;
    return {stability:0,handSpeed:0,shoulderTurn:0,pelvisSpeed:0,ankleSpeed:0};
  }

  const dt=Math.max(0.016,(now-lastPoseTime)/1000);
  const ids=[11,12,13,14,15,16,23,24,25,26,27,28];
  let sum=0,n=0;
  for(const i of ids){
    if(lm[i] && lastPose[i]){sum+=dist(lm[i],lastPose[i]);n++}
  }
  const stability=n?sum/n:0;

  const pelvis={x:(lm[23].x+lm[24].x)/2,y:(lm[23].y+lm[24].y)/2};
  const prevPelvis={x:(lastPose[23].x+lastPose[24].x)/2,y:(lastPose[23].y+lastPose[24].y)/2};
  const pelvisSpeed=dist(pelvis,prevPelvis)/dt;

  const ankles={x:(lm[27].x+lm[28].x)/2,y:(lm[27].y+lm[28].y)/2};
  const prevAnkles={x:(lastPose[27].x+lastPose[28].x)/2,y:(lastPose[27].y+lastPose[28].y)/2};
  const ankleSpeed=dist(ankles,prevAnkles)/dt;

  // 양손의 중간점을 골반 기준으로 계산.
  // 걷기 때는 양팔이 반대로 흔들려 중간점 이동이 상대적으로 작고,
  // 골프 스윙 때는 두 손이 함께 크게 움직인다.
  const hands={x:(lm[15].x+lm[16].x)/2,y:(lm[15].y+lm[16].y)/2};
  const prevHands={x:(lastPose[15].x+lastPose[16].x)/2,y:(lastPose[15].y+lastPose[16].y)/2};
  const relHands={x:hands.x-pelvis.x,y:hands.y-pelvis.y};
  const prevRelHands={x:prevHands.x-prevPelvis.x,y:prevHands.y-prevPelvis.y};
  const handSpeed=dist(relHands,prevRelHands)/dt;

  const shoulderNow=Math.atan2(lm[12].y-lm[11].y,lm[12].x-lm[11].x);
  const shoulderPrev=Math.atan2(lastPose[12].y-lastPose[11].y,lastPose[12].x-lastPose[11].x);
  let shoulderTurn=Math.abs(shoulderNow-shoulderPrev);
  if(shoulderTurn>Math.PI) shoulderTurn=2*Math.PI-shoulderTurn;

  lastPose=lm.map(p=>({x:p.x,y:p.y}));
  lastPoseTime=now;
  return {stability,handSpeed,shoulderTurn,pelvisSpeed,ankleSpeed};
}

function addressSimilarity(lm){
  if(!lm) return {ok:false,score:0};
  const needed=[11,12,15,16,23,24,25,26,27,28];
  if(needed.some(i=>!lm[i] || (lm[i].visibility!=null && lm[i].visibility<0.20))) return {ok:false,score:0};

  const ls=lm[11], rs=lm[12], lh=lm[23], rh=lm[24];
  const lk=lm[25], rk=lm[26], la=lm[27], ra=lm[28];
  const lw=lm[15], rw=lm[16];

  const shoulderMid={x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2};
  const hipMid={x:(lh.x+rh.x)/2,y:(lh.y+rh.y)/2};
  const kneeMid={x:(lk.x+rk.x)/2,y:(lk.y+rk.y)/2};
  const ankleMid={x:(la.x+ra.x)/2,y:(la.y+ra.y)/2};
  const handMid={x:(lw.x+rw.x)/2,y:(lw.y+rw.y)/2};

  const torsoLen=Math.max(0.001,dist(shoulderMid,hipMid));
  const feetGap=Math.abs(la.x-ra.x);
  const kneeGap=Math.abs(lk.x-rk.x);
  const handGap=dist(lw,rw);
  const handBelowShoulders=(handMid.y-shoulderMid.y)/torsoLen;
  const handFromHips=Math.abs(handMid.y-hipMid.y)/torsoLen;
  const hipToKnee=Math.max(0.001,dist(hipMid,kneeMid));
  const kneeToAnkle=Math.max(0.001,dist(kneeMid,ankleMid));
  const bodyCentered=hipMid.x>0.18 && hipMid.x<0.82;

  // V11.1B: 스윙 감지 로직은 V11.1 그대로 유지.
  // 어드레스 판정에만 '명확한 짝다리' 제외 조건을 추가한다.
  //
  // 짝다리 판정은 한 가지 값으로 단정하지 않고,
  // 좌우 골반 높이 + 좌우 무릎 높이 + 양발 높이 차이를 함께 본다.
  // 정상적인 골프 어드레스의 약간의 비대칭은 허용한다.
  const hipLevelDiff=Math.abs(lh.y-rh.y);
  const kneeLevelDiff=Math.abs(lk.y-rk.y);
  const ankleLevelDiff=Math.abs(la.y-ra.y);

  // 한쪽 다리에 체중을 크게 싣고 서 있을 때 흔히 나타나는
  // 과도한 좌우 하체 비대칭만 제외.
  const obviousOneLeg =
    (hipLevelDiff>0.085 && kneeLevelDiff>0.095) ||
    (kneeLevelDiff>0.13) ||
    (ankleLevelDiff>0.12 && hipLevelDiff>0.065);

  let score=0;
  if(bodyCentered) score++;
  if(feetGap>=0.055 && feetGap<=0.38) score++;
  if(kneeGap>=0.04 && kneeGap<=0.34) score++;
  if(handGap<=0.24) score++;
  if(handBelowShoulders>=0.45 && handBelowShoulders<=2.50) score++;
  if(handFromHips<=1.55) score++;
  if(hipToKnee>=0.13 && kneeToAnkle>=0.13) score++;

  // Read-only per-condition diagnostics; do not alter the seven scoring rules.
  const checks=[
    ['골반 중앙',bodyCentered,hipMid.x,'0.18~0.82'],
    ['발 간격',feetGap>=0.055 && feetGap<=0.38,feetGap,'0.055~0.38'],
    ['무릎 간격',kneeGap>=0.04 && kneeGap<=0.34,kneeGap,'0.04~0.34'],
    ['양손 간격',handGap<=0.24,handGap,'≤0.24'],
    ['손 높이',handBelowShoulders>=0.45 && handBelowShoulders<=2.50,handBelowShoulders,'0.45~2.50'],
    ['손-골반',handFromHips<=1.55,handFromHips,'≤1.55'],
    ['다리 길이',hipToKnee>=0.13 && kneeToAnkle>=0.13,Math.min(hipToKnee,kneeToAnkle),'≥0.13']
  ];
  // 기존 V11.1 계열처럼 7개 중 5개 이상이면 어드레스 후보.
  // 단, 명확한 짝다리로 판단되면 ADDRESS로 인정하지 않는다.
  return {ok:(score>=5 && !obviousOneLeg),score,obviousOneLeg,checks};
}


// Project MediaPipe's 90-degree-normalized source points onto the actual
// object-fit:contain camera pixels, then apply the user's display rotation.
// This is DISPLAY ONLY: address/READY logic still receives original landmarks.
function svPoseDisplayPoint(p){
  // MediaPipe receives the camera source rotated +90 degrees.
  // Invert that rotation to source pixels, then reproduce the *actual*
  // HTMLVideoElement object-fit:contain mapping and its CSS rotation.
  // Use measured DOM sizes, not a guessed stage aspect ratio.
  const W=view.width,H=view.height;
  if(!raw.videoWidth||!raw.videoHeight)return {x:p.x*W,y:p.y*H};
  const sourceX=p.y,sourceY=1-p.x;
  const vw=raw.videoWidth,vh=raw.videoHeight;
  const boxW=raw.clientWidth,boxH=raw.clientHeight;
  if(!boxW||!boxH)return {x:p.x*W,y:p.y*H};
  const style=getComputedStyle(raw);
  const fit=style.objectFit;
  const scale=fit==='cover'?Math.max(boxW/vw,boxH/vh):
              fit==='fill'?null:Math.min(boxW/vw,boxH/vh);
  const dx=(sourceX-.5)*vw*(scale===null?boxW/vw:scale);
  const dy=(sourceY-.5)*vh*(scale===null?boxH/vh:scale);
  const angle=((window.svPreviewRotationDeg??90)%360+360)%360;
  const rad=angle*Math.PI/180;
  // raw and view are centered on the same liveStage, but the canvas
  // can have a different CSS pixel origin; account for that explicitly.
  const stageRect=$('liveStage').getBoundingClientRect();
  const viewRect=view.getBoundingClientRect();
  const centerX=stageRect.left+stageRect.width/2-viewRect.left;
  const centerY=stageRect.top+stageRect.height/2-viewRect.top;
  return {x:centerX+dx*Math.cos(rad)-dy*Math.sin(rad),
          y:centerY+dx*Math.sin(rad)+dy*Math.cos(rad)};
}
// Experimental LIVE overlay: measured MediaPipe wrist/elbow tracks only.
// Never interpolate across missing or low-confidence observations.
const svJointTrailHistory={13:[],14:[],15:[],16:[]};
const svJointTrailLimit=900;
function svResetJointTrails(){
  for(const k of [13,14,15,16])svJointTrailHistory[k].length=0;
}
function drawSkeleton(lm){
  if(!lm)return;
  const leftHip=lm[23],rightHip=lm[24];
  const hipCenter=(leftHip&&rightHip)
    ? svPoseDisplayPoint({x:(leftHip.x+rightHip.x)/2,y:(leftHip.y+rightHip.y)/2})
    : {x:view.width/2,y:view.height/2};
  const displayPoint=p=>{
    const pt=svPoseDisplayPoint(p);
    return {x:hipCenter.x+(pt.x-hipCenter.x)*1.2,
            y:hipCenter.y+(pt.y-hipCenter.y)*1.2};
  };
  const specs=[
    {i:13,color:'255,218,38',alpha:.40,width:1.1},
    {i:14,color:'255,218,38',alpha:.40,width:1.1},
    {i:15,color:'255,55,55',alpha:.92,width:1.5},
    {i:16,color:'255,55,55',alpha:.92,width:1.5}
  ];
  for(const spec of specs){
    const p=lm[spec.i],history=svJointTrailHistory[spec.i];
    const valid=p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&(p.visibility??1)>=.55;
    if(valid){
      const point=displayPoint(p);
      if(Number.isFinite(point.x)&&Number.isFinite(point.y)){
        history.push({x:point.x,y:point.y,valid:true});
        if(history.length>svJointTrailLimit)history.shift();
      }else history.push({valid:false});
    }else history.push({valid:false});
    if(history.length>svJointTrailLimit)history.shift();
    ctx.save();ctx.lineWidth=spec.width;ctx.strokeStyle='rgba('+spec.color+','+spec.alpha+')';
    ctx.beginPath();let connected=false;
    for(const pt of history){
      if(!pt.valid){connected=false;continue;}
      if(!connected){ctx.moveTo(pt.x,pt.y);connected=true;}
      else ctx.lineTo(pt.x,pt.y);
    }
    ctx.stroke();
    if(valid&&history.length&&history[history.length-1].valid){
      const pt=history[history.length-1];
      ctx.beginPath();ctx.arc(pt.x,pt.y,spec.i>=15?3:2.6,0,Math.PI*2);
      ctx.fillStyle='rgba('+spec.color+','+(spec.i>=15?1:.5)+')';ctx.fill();
    }
    ctx.restore();
  }
}

function startRecording(){
  if(recording || !stream) return;
  chunks=[];
  // Choose only a recording format actually supported by this browser.
  // Safari/iOS commonly supports MP4, while Chromium browsers may prefer WebM.
  let opt={};
  const formats=['video/webm;codecs=vp8','video/webm','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4'];
  if(typeof MediaRecorder.isTypeSupported==='function'){
    const format=formats.find(type=>MediaRecorder.isTypeSupported(type));
    if(format) opt={mimeType:format};
  }
  recorder=new MediaRecorder(stream,opt);
  recorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data)};
  recorder.onstop=()=>{
    recording=false;
    if(!chunks.length) return;
    const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});
    latestReplayBlob=blob;
    if(replay.src) URL.revokeObjectURL(replay.src);
    replay.src=URL.createObjectURL(blob);
    replay.loop=true; replay.muted=true; replay.load();
    replay.onloadedmetadata=()=>{
      // The captured portrait WebM has upright 720x1280 pixels and no rotation metadata.
      // Render portrait recordings unrotated; leave desktop and imported videos unchanged.
      if(raw.videoHeight>raw.videoWidth && replay.videoHeight>replay.videoWidth){
        window.svFrontRotation=0;
        const rotateBtn=document.getElementById('frontRotateBtn');
        if(rotateBtn)rotateBtn.textContent='영상회전 0°';
      }
      $('replayPlay').disabled=false;$('replayPause').disabled=false;
      $('sendA').disabled=false;$('sendB').disabled=false;$('frontJointBtn').disabled=false;
      $('frameBack').disabled=false;$('frameNext').disabled=false;
      $('speedMenuBtn').disabled=false;$('frontRotateBtn').disabled=false;
      $('replaySeek').disabled=false;
      replay.playbackRate=window.svGetAutoReplaySpeed?window.svGetAutoReplaySpeed():0.5;
      $('speedMenuBtn').textContent='속도 '+replay.playbackRate.toFixed(replay.playbackRate%1?2:1)+'× ▾';
      document.querySelectorAll('.speedChoice').forEach(b=>{
        b.className='speedChoice '+(Number(b.dataset.speed)===1?'green':'white');
      });
      $('timeTotal').textContent=replay.duration.toFixed(2);
      replay.currentTime=0;replay.play().catch(()=>{});if(typeof window.svShowReplay==='function')window.svShowReplay();
      $('result').textContent='최근 정상 스윙 · 다음 정상 스윙 전까지 반복 유지';
    };
  };
  recorder.start(100);
  recording=true;
  // V12.1: 정면 관절감지 트리거와 같은 순간에 측면도 녹화
  if(typeof window.startSideRecording==='function'){
    try{ window.startSideRecording(); }catch(e){ console.warn('side record start',e); }
  }
}

function stopRecordingSoon(){
  setTimeout(()=>{if(recorder&&recorder.state==='recording') recorder.stop()},SWING_CAPTURE_MS);
}

// ADDRESS diagnostic display only; scoring and READY thresholds are unchanged.
const svAddressHistory={samples:0,best:null,last:null,bestStable:null,stableStart:0,longestHold:0,stableFrames:0,stableCount:0};
window.svAddressHistory=svAddressHistory;
const svAxisTrace={frames:0,missing:{},failed:[0,0,0,0,0,0,0],best:null,last:null,nearZeroFeet:0,nearZeroKnees:0};
function svAxisSample(lm,check){
 if(!lm)return;
 const t=svAxisTrace;t.frames++;
 const ids=[11,12,15,16,23,24,25,26,27,28];
 for(const id of ids){if(!lm[id]||!Number.isFinite(lm[id].x)||!Number.isFinite(lm[id].y)||((lm[id].visibility??1)<.20))t.missing[id]=(t.missing[id]||0)+1;}
 if(check.checks)check.checks.forEach((c,i)=>{if(!c[1])t.failed[i]++;});
 const a=lm[27],b=lm[28],k=lm[25],j=lm[26];
 if(a&&b&&Number.isFinite(a.x)&&Number.isFinite(b.x)&&Math.abs(a.x-b.x)<.02)t.nearZeroFeet++;
 if(k&&j&&Number.isFinite(k.x)&&Number.isFinite(j.x)&&Math.abs(k.x-j.x)<.02)t.nearZeroKnees++;
 const snap={score:check.score,oneLeg:!!check.obviousOneLeg,points:ids.map(id=>{const p=lm[id];return id+':'+(p?Number(p.x).toFixed(3)+','+Number(p.y).toFixed(3)+' v'+Number(p.visibility??1).toFixed(2):'없음');}).join(' | ')};
 t.last=snap;if(!t.best||snap.score>t.best.score)t.best=snap;
}
function svAxisReport(){
 const t=svAxisTrace,labels=['골반 중앙','발 간격','무릎 간격','양손 간격','손 높이','손-골반','다리 길이'];
 return '\n\n[카메라·관절 좌표 진단]\n원본 영상 '+(raw.videoWidth||0)+'×'+(raw.videoHeight||0)+' / MediaPipe 입력 '+poseInput.width+'×'+poseInput.height+
 ' / 입력 회전 +90도 / 화면 회전 '+(window.svPreviewRotationDeg??90)+'도 / 판정 좌표 '+(window.matchMedia('(orientation: portrait) and (pointer: coarse)').matches && raw.videoHeight>raw.videoWidth?'원본 세로축 복원':'기존 좌표')+
 '\n좌표 샘플 '+t.frames+'프레임 / 양발 X차이 0.02 미만 '+t.nearZeroFeet+'회 / 무릎 X차이 0.02 미만 '+t.nearZeroKnees+'회'+
 '\n관절 누락·저신뢰(0.20 미만): '+[11,12,15,16,23,24,25,26,27,28].map(i=>i+'='+ (t.missing[i]||0)).join(' ')+
 '\n조건 실패 횟수: '+labels.map((v,i)=>v+' '+t.failed[i]).join(' / ')+
 '\n최고 점수 좌표('+ (t.best?.score??'UNKNOWN')+'/7, 비대칭 '+(t.best?.oneLeg?'YES':'NO')+'): '+(t.best?.points??'없음')+
 '\n마지막 좌표: '+(t.last?.points??'없음');
}
function svAxisReset(){Object.assign(svAxisTrace,{frames:0,missing:{},failed:[0,0,0,0,0,0,0],best:null,last:null,nearZeroFeet:0,nearZeroKnees:0});}
const svReadyTrace={frames:0,firstAt:0,lastAt:0,gapSum:0,gapCount:0,maxGap:0,over450:0,candidates:0,resets:{frameGap:0,anchorMotion:0,invalidGeometry:0},rejected:{score:0,oneLeg:0,coordinates:0},maxCandidateMs:0,readyCount:0,lastReason:'대기',lastScore:0,lastAnchorMotion:null};
function svReadyTraceReport(){
 const t=svReadyTrace,seconds=(t.lastAt-t.firstAt)/1000;
 return '\n\n[READY 실제 경로 진단]\n관절 프레임 '+t.frames+' · 유효 FPS '+(seconds>0?((t.frames-1)/seconds).toFixed(1):'UNKNOWN')+' · 평균 간격 '+(t.gapCount?(t.gapSum/t.gapCount).toFixed(0):'UNKNOWN')+'ms · 최대 간격 '+Math.round(t.maxGap)+'ms'+
 '\n450ms 초과 '+t.over450+'회 · 후보 시작 '+t.candidates+'회 · 최대 후보 유지 '+Math.round(t.maxCandidateMs)+' / '+STABLE_MS+'ms'+
 '\n후보 초기화: 프레임 지연 '+t.resets.frameGap+' / 중심 이동 '+t.resets.anchorMotion+' / 자세·좌표 탈락 '+t.resets.invalidGeometry+
 '\n후보 불가: 점수 부족 '+t.rejected.score+' / 하체 비대칭 '+t.rejected.oneLeg+' / 좌표 범위 이탈 '+t.rejected.coordinates+
 '\nREADY 성공 '+t.readyCount+'회 · 마지막 상태 '+t.lastReason+' · 마지막 점수 '+t.lastScore+'/7 · 중심 이동 '+(t.lastAnchorMotion===null?'UNKNOWN':t.lastAnchorMotion.toFixed(3));
}
function svReadyTraceReset(){Object.assign(svReadyTrace,{frames:0,firstAt:0,lastAt:0,gapSum:0,gapCount:0,maxGap:0,over450:0,candidates:0,resets:{frameGap:0,anchorMotion:0,invalidGeometry:0},rejected:{score:0,oneLeg:0,coordinates:0},maxCandidateMs:0,readyCount:0,lastReason:'초기화',lastScore:0,lastAnchorMotion:null});}
function svAddressSnapshot(lm,check,m){
  const needed=[11,12,15,16,23,24,25,26,27,28];
  const names={11:'왼어깨',12:'오른어깨',15:'왼손목',16:'오른손목',23:'왼골반',24:'오른골반',25:'왼무릎',26:'오른무릎',27:'왼발목',28:'오른발목'};
  const missing=needed.filter(i=>!lm?.[i]||(lm[i].visibility!=null&&lm[i].visibility<0.20));
  const fail=[];
  if(missing.length)fail.push('관절 부족: '+missing.map(i=>names[i]).join(', '));
  if(!check.ok)fail.push(check.obviousOneLeg?'하체 비대칭':'어드레스 점수 부족');
  if(!(m.stability<0.020))fail.push('안정도 초과');
  if(!(m.pelvisSpeed<MAX_PELVIS_SPEED))fail.push('골반 이동 초과');
  if(!(m.ankleSpeed<MAX_ANKLE_SPEED))fail.push('발목 이동 초과');
  if(!fail.length)fail.push('자세 유지시간 확인 중');
  const fmt=v=>Number.isFinite(v)?v.toFixed(3):'UNKNOWN';
  const lines=[
    '점수 '+check.score+'/7 · 하체 '+(missing.some(i=>i>=25)?'인식 부족':'인식 확인'),
    '안정도 '+fmt(m.stability)+' / 0.020',
    '골반속도 '+fmt(m.pelvisSpeed)+' / '+MAX_PELVIS_SPEED,
    '발목속도 '+fmt(m.ankleSpeed)+' / '+MAX_ANKLE_SPEED,
    '7개 판정:',
    ...(check.checks?check.checks.map(c=>(c[1]?'✓ ':'× ')+c[0]+' '+(Number.isFinite(c[2])?c[2].toFixed(3):'?')+' ('+c[3]+')'):['관절 데이터 부족']),
    '차단: '+fail.join(' · ')
  ];
  return {score:check.score,valid:!!check.checks,lines:lines.join('\n'),timestamp:new Date().toLocaleTimeString('ko-KR')};
}
function svAddressDiagnostic(lm,check,m){
  let dock=document.getElementById('svAddressDiag');
  if(!dock){
    dock=document.createElement('div');dock.id='svAddressDiag';
    dock.innerHTML='<button id="svAddressDiagToggle" type="button" aria-expanded="false">LOCK 진단 ▸</button><div id="svAddressDiagDetail" hidden></div>';
    document.body.appendChild(dock);
    dock.querySelector('#svAddressDiagToggle').addEventListener('click',()=>{
      const detail=dock.querySelector('#svAddressDiagDetail');
      detail.hidden=!detail.hidden;
      svAddressDiagnostic(lm,check,m,false);
    });
    const controls=document.createElement('div');controls.id='svAddressHistoryControls';
    controls.innerHTML='<button type="button" id="svAddressClear">기록 초기화</button><button type="button" id="svAddressCopy">결과 복사</button>';
    dock.appendChild(controls);
    controls.querySelector('#svAddressClear').addEventListener('click',()=>{
      svAddressHistory.samples=0;svAddressHistory.best=null;svAddressHistory.last=null;svAddressHistory.bestStable=null;svAddressHistory.stableStart=0;svAddressHistory.longestHold=0;svAddressHistory.stableFrames=0;svAddressHistory.stableCount=0;svReadyTraceReset();svAxisReset();
      svAddressDiagnostic(null,{score:0,ok:false}, {stability:NaN,pelvisSpeed:NaN,ankleSpeed:NaN},false);
    });
    controls.querySelector('#svAddressCopy').addEventListener('click',()=>{
      const report='SV MOBILE ADDRESS 진단\n'+(svAddressHistory.best?'최고 점수 '+svAddressHistory.best.score+'/7 · '+svAddressHistory.best.timestamp+'\n'+svAddressHistory.best.lines:'저장된 사람 인식 기록 없음')+'\n\n최장 안정 유지 '+Math.round(svAddressHistory.longestHold)+' / '+STABLE_MS+' ms\n'+(svAddressHistory.bestStable?'최장 안정 구간 '+svAddressHistory.bestStable.timestamp+'\n'+svAddressHistory.bestStable.lines:'안정 조건 동시 충족 기록 없음')+svReadyTraceReport()+svAxisReport();
      if(navigator.clipboard?.writeText)navigator.clipboard.writeText(report).catch(()=>{});
    });
  }
  const snapshot=svAddressSnapshot(lm,check,m);
  if(!lm) {svAddressHistory.stableStart=0;svAddressHistory.stableFrames=0;}
  // Preserve last valid full-body measurement even after the golfer leaves the frame.
  if(lm && check.checks && armed){
    svAddressHistory.samples++;
    snapshot.metrics={stability:m.stability,pelvisSpeed:m.pelvisSpeed,ankleSpeed:m.ankleSpeed};
    snapshot.eligible=check.ok && m.stability<0.020 && m.pelvisSpeed<MAX_PELVIS_SPEED && m.ankleSpeed<MAX_ANKLE_SPEED;
    svAddressHistory.last=snapshot;
    if(!svAddressHistory.best || snapshot.score>svAddressHistory.best.score)svAddressHistory.best=snapshot;
    // Capture stable address intervals independently of the READY state machine.
    const eligible=check.ok && m.stability<0.020 &&
      m.pelvisSpeed<MAX_PELVIS_SPEED && m.ankleSpeed<MAX_ANKLE_SPEED;
    if(eligible){
      const t=performance.now();
      if(!svAddressHistory.stableStart)svAddressHistory.stableStart=t;
      const held=t-svAddressHistory.stableStart;
      svAddressHistory.stableFrames++;
      svAddressHistory.stableCount++;
      if(held>svAddressHistory.longestHold)svAddressHistory.longestHold=held;
      if(!svAddressHistory.bestStable || held>svAddressHistory.bestStable.held){
        svAddressHistory.bestStable={...snapshot,held,stableFrames:svAddressHistory.stableFrames};
      }
    }else{
      svAddressHistory.stableStart=0;svAddressHistory.stableFrames=0;
    }
  }
  const detail=dock.querySelector('#svAddressDiagDetail');
  const best=svAddressHistory.best;
  const head=dock.querySelector('#svAddressDiagToggle');
  head.textContent='LOCK 진단 '+(armed?'ON':'OFF')+' · 현재 '+check.score+'/7 · 최고 '+(best?best.score+'/7':'없음')+(detail.hidden?' ▸':' ▾');
  detail.textContent=
    '감지 '+(armed?'ON':'OFF')+' · 기록 '+svAddressHistory.samples+'회'+
    '\n현재: '+snapshot.lines+
    '\n\n━━ 자동 보존된 최고 점수 ━━\n'+
    (best?best.timestamp+'\n'+best.lines:'아직 저장된 자세 없음')+
    '\n\n━━ 가장 안정적인 어드레스 구간 ━━\n'+
    '동시 충족 프레임 '+svAddressHistory.stableCount+'회 · 최장 연속 '+Math.round(svAddressHistory.longestHold)+' / '+STABLE_MS+' ms\n'+
    (svAddressHistory.bestStable?svAddressHistory.bestStable.timestamp+'\n'+svAddressHistory.bestStable.lines:'안정 조건 동시 충족 기록 없음')+
    '\nLOCK '+(addressLocked?'ON':'OFF');
}

// Mobile portrait: the observed +90° MediaPipe frame has its anatomical
// left/right axis on pose Y. Convert only analysis landmarks back to the
// camera-source portrait axes. Rendering continues to use original landmarks.
function svAddressAnalysisLandmarks(lm){
  if(!lm)return lm;
  const portraitPhone=window.matchMedia('(orientation: portrait) and (pointer: coarse)').matches;
  const rotatedInput=raw.videoWidth>0 && raw.videoHeight>raw.videoWidth &&
    poseInput.width===raw.videoHeight && poseInput.height===raw.videoWidth;
  if(!portraitPhone || !rotatedInput)return lm;
  return lm.map(p=>p?{...p,x:p.y,y:1-p.x}:p);
}
async function onResults(results){
  processing=false;
  lastPoseRenderAt=performance.now();
  latestLandmarks=results.poseLandmarks||null;
  const now=performance.now();

  const r=view.getBoundingClientRect();
  if(view.width!==Math.round(r.width)||view.height!==Math.round(r.height)){
    view.width=Math.round(r.width);view.height=Math.round(r.height);
  }

  ctx.clearRect(0,0,view.width,view.height);
  sizeRawPreview();

  const present=personVisible(latestLandmarks);
  $('presence').textContent=present?'사람 있음':'사람 없음';

  if(!present){
    // Expose missing-pose state instead of leaving stale diagnostic numbers.
    svAddressDiagnostic(latestLandmarks,{ok:false,score:0,obviousOneLeg:false},{stability:NaN,pelvisSpeed:NaN,ankleSpeed:NaN});
    ready=false;addressLocked=false;stableSince=0;svResetAddressCandidate();swingStarted=false;lastPose=null;lastPoseTime=0;
    $('stable').textContent='0.00';$('wristSpeed').textContent='0.00';
    $('addressState').textContent='OFF';$('swingState').textContent='대기';
    $('state').className='state wait';$('state').textContent='사람 없음 · 대기';
    $('status').textContent='최근 정상 스윙 리플레이는 그대로 유지됩니다.';
    return;
  }

  // MediaPipe 입력 자체를 90° 정상화했으므로 관절좌표를 그대로 사용한다.
  const rotated=latestLandmarks;
  drawSkeleton(rotated);

  const analysisPose=svAddressAnalysisLandmarks(rotated);
  const m=poseMotionMetrics(analysisPose,now);
  $('stable').textContent=m.stability.toFixed(3);
  $('wristSpeed').textContent=m.handSpeed.toFixed(2);

  // Always refresh diagnostics while pose frames arrive, even when swing detection is OFF.
  const addressCheck=addressSimilarity(analysisPose);
  const isAddress=addressCheck.ok;
  if(armed)svAxisSample(analysisPose,addressCheck);
  svAddressDiagnostic(analysisPose,addressCheck,m);
  if(!armed || cooldown) return;
  {const t=svReadyTrace,gap=t.lastAt?now-t.lastAt:0;if(!t.firstAt)t.firstAt=now;t.frames++;if(t.lastAt){t.gapSum+=gap;t.gapCount++;t.maxGap=Math.max(t.maxGap,gap);if(gap>450)t.over450++;}t.lastAt=now;t.lastScore=addressCheck.score;}

  if(!ready && !swingStarted){
    // ADDRESS LOCK is mandatory. Without it, every movement is treated as normal movement.
    // Use a bounded temporal filter for noisy phone landmarks.
    // A single frame cannot establish a pose or produce READY.
    const elapsed=svAddressLastFrame?now-svAddressLastFrame:0;
    svAddressLastFrame=now;
    if(elapsed>450){if(svAddressCandidateSince){svReadyTrace.resets.frameGap++;svReadyTrace.lastReason='프레임 간격 '+Math.round(elapsed)+'ms';}svResetAddressCandidate();}
    // Confirm address from repeated pose geometry, not frame-to-frame pixel jitter.
    // Require a mostly stationary hip/ankle anchor over the whole 850ms window.
    const hip=analysisPose[23]&&analysisPose[24]
      ? {x:(analysisPose[23].x+analysisPose[24].x)/2,y:(analysisPose[23].y+analysisPose[24].y)/2}:null;
    const ankle=analysisPose[27]&&analysisPose[28]
      ? {x:(analysisPose[27].x+analysisPose[28].x)/2,y:(analysisPose[27].y+analysisPose[28].y)/2}:null;
    const validGeometry=isAddress && hip && ankle &&
      [hip.x,hip.y,ankle.x,ankle.y].every(Number.isFinite) &&
      hip.x>=0 && hip.x<=1 && hip.y>=0 && hip.y<=1 &&
      ankle.x>=0 && ankle.x<=1 && ankle.y>=0 && ankle.y<=1;
    if(!validGeometry){if(addressCheck.score<5)svReadyTrace.rejected.score++;else if(addressCheck.obviousOneLeg)svReadyTrace.rejected.oneLeg++;else svReadyTrace.rejected.coordinates++;}
    if(validGeometry){
      if(!svAddressCandidateSince){
        svReadyTrace.candidates++;
        svAddressCandidateSince=now;
        svAddressAnchorHip={...hip};svAddressAnchorAnkle={...ankle};
        svAddressGoodFrames=0;svAddressTotalFrames=0;
      }
      const anchorMotion=dist(hip,svAddressAnchorHip)+dist(ankle,svAddressAnchorAnkle);
      svReadyTrace.lastAnchorMotion=anchorMotion;
      if(anchorMotion>0.18){
        svReadyTrace.resets.anchorMotion++;svReadyTrace.lastReason='중심 이동 '+anchorMotion.toFixed(3);
        svReadyTrace.maxCandidateMs=Math.max(svReadyTrace.maxCandidateMs,now-svAddressCandidateSince);
        svResetAddressCandidate(); // Walking or significant repositioning
      }else{
        svAddressLastGood=now;svAddressGoodFrames++;svAddressTotalFrames++;
      }
    }else if(svAddressCandidateSince && now-svAddressLastGood<=SV_ADDRESS_GAP_MS){
      svAddressTotalFrames++;
    }else{
      if(svAddressCandidateSince){svReadyTrace.maxCandidateMs=Math.max(svReadyTrace.maxCandidateMs,now-svAddressCandidateSince);svReadyTrace.resets.invalidGeometry++;svReadyTrace.lastReason=addressCheck.obviousOneLeg?'하체 비대칭':'자세 또는 좌표 탈락';}
      svResetAddressCandidate();
    }
    const held=svAddressCandidateSince?now-svAddressCandidateSince:0;
    svReadyTrace.maxCandidateMs=Math.max(svReadyTrace.maxCandidateMs,held);
    const confirmed=svAddressCandidateSince && svAddressGoodFrames>=SV_ADDRESS_MIN_GOOD_FRAMES &&
      svAddressTotalFrames>0 && svAddressGoodFrames/svAddressTotalFrames>=0.70 &&
      now-svAddressLastGood<=SV_ADDRESS_GAP_MS;
    if(svAddressCandidateSince){
      $('addressState').textContent='CHECK '+addressCheck.score+'/7';
      $('state').className='state wait';
      $('state').textContent='어드레스 유사범위 확인 '+Math.min(STABLE_MS,held).toFixed(0)+' / '+STABLE_MS+' ms';

      if(held>=STABLE_MS && confirmed){
        svReadyTrace.readyCount++;svReadyTrace.lastReason='READY 성공';
        addressLocked=true;
        ready=true;readyAt=now;stableSince=0;svResetAddressCandidate();
        $('addressState').textContent='LOCK';
        $('overlay').style.display='flex';
        $('state').className='state ready';$('state').textContent='READY';
        $('status').textContent='ADDRESS LOCK 완료 · 0.3초 후 삑 소리가 나면 바로 스윙하세요.';

        setTimeout(()=>{
          if(ready && addressLocked){
            tone(980,.12);
            $('state').textContent='READY · 삑 — 지금 스윙';
            $('status').textContent='ADDRESS LOCK 이후의 관절 움직임만 스윙 후보로 판단합니다.';
          }
        },READY_BEEP_DELAY);

        setTimeout(()=>$('overlay').style.display='none',900);
      }
    }else{
      stableSince=0;
      addressLocked=false;
      $('addressState').textContent=isAddress?'유사 '+addressCheck.score+'/7':'OFF';
      $('state').className='state wait';
      if(addressCheck.obviousOneLeg){
        $('state').textContent='짝다리/하체 비대칭 · 일반동작';
        $('status').textContent='명확한 짝다리 자세는 ADDRESS로 인정하지 않습니다.';
      }else{
        $('state').textContent=isAddress?'어드레스 유사 · 안정 대기':'일반동작 · 어드레스 대기';
        $('status').textContent='ADDRESS LOCK 전에는 어떤 움직임도 스윙으로 판단하지 않습니다.';
      }
    }
    return;
  }

  if(ready && addressLocked && !swingStarted){
    if(now-readyAt<READY_BEEP_DELAY) return;

    // 걷기 배제 핵심:
    // 1) 골반이 이동하지 않아야 함
    // 2) 발목 중심이 이동하지 않아야 함
    // 3) 양손이 골반에 대해 함께 빠르게 움직여야 함
    // 4) 어깨 회전이 같이 나와야 함
    const feetPlanted =
      m.pelvisSpeed<MAX_PELVIS_SPEED &&
      m.ankleSpeed<MAX_ANKLE_SPEED;

    const golfPattern =
      m.handSpeed>=SWING_HAND_SPEED &&
      m.shoulderTurn>=SWING_SHOULDER_TURN;

    if(feetPlanted && golfPattern){
      swingStarted=true;ready=false;swingStartAt=now;
      $('swingState').textContent='스윙';
      $('state').className='state impact';$('state').textContent='SWING 감지';
      $('status').textContent='골프 스윙 패턴 확인 · 영상 저장 중';

      startRecording();
      stopRecordingSoon();
      cooldown=true;

      setTimeout(()=>{
        swingStarted=false;addressLocked=false;ready=false;lastPose=null;lastPoseTime=0;cooldown=false;
        $('addressState').textContent='OFF';$('swingState').textContent='대기';
        $('state').className='state wait';$('state').textContent='다음 스윙 대기';
        $('status').textContent='최근 스윙 반복재생 유지 · 다음 어드레스를 기다립니다.';
      },SWING_CAPTURE_MS+1000);
    }
  }
}


let lastPoseRenderAt=0;
function drawRawPreviewFrame(){ sizeRawPreview(); }
function livePreviewLoop(){
  // Pose 결과가 정상적으로 들어오면 onResults가 영상+관절을 그린다.
  // Pose 로딩/처리가 지연될 때는 이 루프가 카메라 영상을 계속 보여준다.
  if(stream && raw.readyState>=2 && (performance.now()-lastPoseRenderAt)>120){
    drawRawPreviewFrame();
  }
  requestAnimationFrame(livePreviewLoop);
}
livePreviewLoop();

async function poseLoop(){
  if(!stream) return;
  if(!processing && raw.readyState>=2 && raw.videoWidth && raw.videoHeight){
    processing=true;
    try{
      // 카메라 센서 원본은 90° 돌아가 있으므로,
      // MediaPipe에는 바로 세운 프레임을 전달한다.
      poseInput.width=raw.videoHeight;
      poseInput.height=raw.videoWidth;
      poseInputCtx.setTransform(1,0,0,1,0,0);
      poseInputCtx.clearRect(0,0,poseInput.width,poseInput.height);
      poseInputCtx.translate(poseInput.width/2,poseInput.height/2);
      poseInputCtx.rotate(Math.PI/2);
      poseInputCtx.drawImage(raw,-raw.videoWidth/2,-raw.videoHeight/2);
      poseInputCtx.setTransform(1,0,0,1,0,0);
      await pose.send({image:poseInput});
    }catch(e){
      processing=false;
      if($('status')) $('status').textContent='카메라 영상 연결됨 · 관절모델 준비/처리 중';
    }
  }
  raf=requestAnimationFrame(poseLoop);
}

function replayLoop(){
  if(replay.videoWidth){
    const r=replayCanvas.getBoundingClientRect();
    const cw=Math.max(1,Math.round(r.width)),ch=Math.max(1,Math.round(r.height));
    if(replayCanvas.width!==cw||replayCanvas.height!==ch){
      replayCanvas.width=cw;replayCanvas.height=ch;
    }
    rctx.clearRect(0,0,cw,ch);

    const deg=(window.svFrontRotation??90)%360;
    const rotated=(deg===90||deg===270);
    const sw=replay.videoWidth, sh=replay.videoHeight;
    const outW=rotated?sh:sw, outH=rotated?sw:sh;

    // 원본 종횡비 유지 + 영상 전체 표시 + 크롭/늘어남 금지
    const scale=Math.min(cw/outW,ch/outH);

    rctx.save();
    rctx.translate(cw/2,ch/2);
    rctx.rotate(deg*Math.PI/180);
    rctx.drawImage(replay,-sw*scale/2,-sh*scale/2,sw*scale,sh*scale);
    rctx.restore();
  }
  requestAnimationFrame(replayLoop);
}
replayLoop();



function sizeRawPreview(){
  const stage=$('liveStage');
  if(!stage || !raw || !raw.videoWidth || !raw.videoHeight) return;
  const w=Math.max(1,stage.clientWidth), h=Math.max(1,stage.clientHeight);
  // Because camera is physically mounted 90 degrees, swap stage dimensions.
  raw.style.width=h+'px';
  raw.style.height=w+'px';
}
window.addEventListener('resize',()=>setTimeout(sizeRawPreview,30));

async function refreshCameraList(){
  const sel=$('cameraSelect');
  if(!sel || !navigator.mediaDevices?.enumerateDevices) return;
  try{
    const prev=sel.value;
    const devices=await navigator.mediaDevices.enumerateDevices();
    const cams=devices.filter(d=>d.kind==='videoinput');
    sel.innerHTML='<option value="">기본 카메라 (전면)</option>';
    cams.forEach((d,i)=>{
      const o=document.createElement('option');
      o.value=d.deviceId; o.textContent=d.label||('카메라 '+(i+1)); sel.appendChild(o);
    });
    if([...sel.options].some(o=>o.value===prev)) sel.value=prev;
  }catch(e){}
}
if(navigator.mediaDevices?.addEventListener) navigator.mediaDevices.addEventListener('devicechange',refreshCameraList);
refreshCameraList();

      ? {deviceId:{exact:selectedCamera},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}
      : {facingMode:{exact:'user'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
    $('status').textContent='카메라 권한을 요청하는 중입니다. 브라우저 권한 창에서 허용을 눌러주세요.';
    // Never silently switch a requested front camera to the rear camera.
    stream=await navigator.mediaDevices.getUserMedia({video:videoConstraints,audio:false});
    raw.srcObject=stream;
    raw.style.display='block';
    await raw.play();
    sizeRawPreview();
    if(typeof window.fitLiveStageInsideViewport==='function') setTimeout(window.fitLiveStageInsideViewport,60);
    await refreshCameraList();
    raw.addEventListener('loadedmetadata',sizeRawPreview,{once:true});
    raw.addEventListener('canplay',sizeRawPreview,{once:true});
    drawRawPreviewFrame();

    pose=new Pose({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({
      modelComplexity:1,
      smoothLandmarks:true,
      enableSegmentation:false,
      minDetectionConfidence:0.45,
      minTrackingConfidence:0.45
    });
    pose.onResults(onResults);

    $('connect').disabled=true;$('arm').disabled=false;$('disconnect').disabled=false;
    $('status').textContent='카메라 영상 연결됨 · 90° 정상화 관절감지 준비 완료';
    poseLoop();
  }catch(e){
    const reason=e?.name||'UnknownError';
    const guidance=reason==='NotAllowedError'||reason==='PermissionDeniedError'
      ? '카메라 권한이 거부되었습니다. Chrome 주소창 왼쪽 사이트 설정에서 카메라 허용을 확인하세요. content:// 파일이면 HTTPS 주소로 실행해야 합니다.'
      : reason==='NotReadableError'?'다른 앱이 카메라를 사용 중일 수 있습니다. 카메라 앱을 종료하고 다시 연결하세요.'
      : reason==='NotFoundError'?'사용 가능한 카메라를 찾지 못했습니다.'
      : reason==='OverconstrainedError'?'선택한 카메라의 영상 설정을 지원하지 않습니다. 기본 카메라로 다시 시도하세요.'
      : '브라우저 카메라 권한과 HTTPS 연결 상태를 확인하세요.';
    $('status').textContent='연결 실패: '+reason+' — '+guidance;
  }
};

$('arm').onclick=()=>{
  armed=!armed;ready=false;addressLocked=false;stableSince=0;svResetAddressCandidate();swingStarted=false;lastPose=null;lastPoseTime=0;
  $('arm').textContent=armed?'스윙감지 OFF':'스윙감지 ON';
  $('state').className='state wait';
  $('addressState').textContent='OFF';$('state').textContent=armed?'사람/어드레스 대기':'대기';
  $('status').textContent=armed?'타석에 서서 어드레스를 잡으세요.':'관절감지 OFF';
};


function sendReplayToTUp(slot){
  if(!latestReplayBlob){$('result').textContent='보낼 최근 스윙 영상이 없습니다.';return;}
  const target=(window.opener&&!window.opener.closed)?window.opener:null;
  if(!target){$('result').textContent='티업 회원카드에서 SV 촬영을 열어야 전송됩니다.';return;}
  try{
    target.postMessage({type:'TUP_SV_VIDEO',slot:slot,blob:latestReplayBlob,rotation:90,createdAt:Date.now()},'*');
    $('result').textContent='✓ '+slot+'화면 전송 완료';
  }catch(e){$('result').textContent='전송 실패: '+e.message;}
}
if($('sendA'))$('sendA').onclick=()=>sendReplayToTUp('A');
if($('sendB'))$('sendB').onclick=()=>sendReplayToTUp('B');

$('replayPlay').onclick=()=>replay.play().catch(()=>{});
$('replayPause').onclick=()=>replay.pause();

const REPLAY_FPS=30;

$('frameBack').onclick=()=>{
  replay.pause();
  replay.currentTime=Math.max(0,replay.currentTime-(1/REPLAY_FPS));
};
$('frameNext').onclick=()=>{
  replay.pause();
  replay.currentTime=Math.min(replay.duration||0,replay.currentTime+(1/REPLAY_FPS));
};

$('speedMenuBtn').onclick=(e)=>{
  e.stopPropagation();
  const menu=$('speedMenu');
  menu.style.display=menu.style.display==='none'?'flex':'none';
  menu.style.flexDirection='column';
  menu.style.gap='4px';
};

document.querySelectorAll('.speedChoice').forEach(btn=>{
  btn.onclick=(e)=>{
    e.stopPropagation();
    const speed=Number(btn.dataset.speed);
    replay.playbackRate=speed;
    $('speedMenuBtn').textContent='속도 '+speed.toFixed(speed%1?2:1)+'× ▾';
    document.querySelectorAll('.speedChoice').forEach(b=>{
      b.className='speedChoice '+(b===btn?'green':'white');
    });
    $('speedMenu').style.display='none';
  };
});

document.addEventListener('click',()=>{
  const menu=$('speedMenu');
  if(menu) menu.style.display='none';
});
$('replaySeek').oninput=e=>{
  if(!isFinite(replay.duration)||!replay.duration)return;
  replay.currentTime=(Number(e.target.value)/1000)*replay.duration;
};
replay.addEventListener('timeupdate',()=>{
  $('timeNow').textContent=(replay.currentTime||0).toFixed(2);
  if(isFinite(replay.duration)&&replay.duration>0){
    $('replaySeek').value=Math.round((replay.currentTime/replay.duration)*1000);
    $('timeTotal').textContent=replay.duration.toFixed(2);
  }
});

$('disconnect').onclick=()=>{
  armed=false;
  if(raf) cancelAnimationFrame(raf);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(recorder&&recorder.state==='recording') recorder.stop();
  stream=null;raw.srcObject=null;
  $('connect').disabled=false;$('arm').disabled=true;$('disconnect').disabled=true;
  $('status').textContent='해제됨';
};
</script>

<script id="svV121DualReplayScript">
(function(){
  'use strict';
  const byId=id=>document.getElementById(id);
  function svShowLive(){
    const wrap=document.querySelector('.wrap');if(!wrap)return;
    wrap.classList.add('live-first-mode');wrap.classList.remove('replay-mode');
    setTimeout(()=>{ if(typeof window.fitLiveStageInsideViewport==='function') window.fitLiveStageInsideViewport(); },30);
  }
  function svShowReplay(){
    const wrap=document.querySelector('.wrap');if(!wrap)return;
    wrap.classList.remove('live-first-mode');wrap.classList.add('replay-mode');
    if(typeof applyCameraLayout==='function')applyCameraLayout();
  }

  window.svShowLive=svShowLive;window.svShowReplay=svShowReplay;

  function fitLiveStageInsideViewport(){
    const wrap=document.querySelector('.wrap');
    const panel=byId('svLivePanel');
    const stage=byId('liveStage');
    if(!wrap||!panel||!stage||!wrap.classList.contains('live-first-mode')) return;

    const controls=panel.querySelector(':scope > .controls');
    const stats=panel.querySelector('.stats');
    const state=panel.querySelector('.state');
    const status=panel.querySelector('.status');

    const viewportH=window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight;
    const cs=getComputedStyle(panel);
    const padTop=parseFloat(cs.paddingTop)||0;
    const padBottom=parseFloat(cs.paddingBottom)||0;

    function outerH(el){
      if(!el || getComputedStyle(el).display==='none') return 0;
      const r=el.getBoundingClientRect();
      const st=getComputedStyle(el);
      return r.height + (parseFloat(st.marginTop)||0) + (parseFloat(st.marginBottom)||0);
    }

    const used =
      padTop + padBottom +
      outerH(controls) +
      outerH(stats) +
      outerH(state) +
      outerH(status) +
      10; // 안전 여유

    const available=Math.max(180,Math.floor(viewportH-used));
    stage.style.setProperty('height',available+'px','important');
    stage.style.setProperty('max-height',available+'px','important');

    // 기존 LIVE 원본 사이징 함수 재사용
    if(typeof sizeRawPreview==='function') setTimeout(sizeRawPreview,0);
  }

  window.fitLiveStageInsideViewport=fitLiveStageInsideViewport;
  window.addEventListener('resize',()=>setTimeout(fitLiveStageInsideViewport,30));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>setTimeout(fitLiveStageInsideViewport,30));
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',svShowLive,{once:true});
  else svShowLive();
  const frontPanel=byId('svReplayPanel');
  const livePanel=byId('svLivePanel');
  if(!frontPanel||!livePanel) return;

  /* ---------- 정면 패널 정리 ---------- */
  const frontSub=frontPanel.querySelector('.sub');
  if(frontSub){
    frontSub.className='dualTitle';
    frontSub.innerHTML='<span>REPLAY · 정면</span><span class="camBadge">CAM 1 · 관절감지 기준</span>';
  }
  const frontStage=byId('mainVideoStage');
  if(frontStage){
    frontStage.classList.add('dualStage');
    frontStage.style.height='';
    const jc=document.createElement('canvas');
    jc.id='frontJointCanvas';
    frontStage.appendChild(jc);
  }
  const frontSeek=byId('replaySeek')?.parentElement;
  if(frontSeek) frontSeek.classList.add('seekRow');

  /* ---------- 측면 패널 생성 ---------- */
  const side=document.createElement('div');
  side.className='panel';
  side.id='svSideReplayPanel';
  side.innerHTML=`
    <div class="dualTitle"><span>REPLAY · 측면</span><span class="camBadge">CAM 2 · 동기촬영</span></div>
    <div class="dualStage" id="sideVideoStage">
      <canvas id="sideReplayCanvas"></canvas>
      <canvas id="sideJointCanvas"></canvas>
    </div>
    <video id="sideReplay" playsinline loop muted></video>
    <div class="controls">
      <button id="sidePlay" class="white" disabled>재생</button>
      <button id="sidePause" class="dark" disabled>정지</button>
      <button id="sideSendA" class="green" disabled>A화면 보내기</button>
      <button id="sideSendB" class="green" disabled>B화면 보내기</button>
      <button id="sideJointBtn" class="dark" disabled>관절보기 OFF</button>
      <button id="sideFrameBack" class="white" disabled>◀1F</button>
      <button id="sideFrameNext" class="white" disabled>1F▶</button>
      <select id="sideSpeed" class="white" disabled>
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option><option value="1" selected>1.0×</option>
        <option value="1.5">1.5×</option><option value="2">2.0×</option>
      </select>
      <button id="sideRotateBtn" class="white" disabled>영상회전 90°</button>
    </div>
    <div class="seekRow">
      <span id="sideTimeNow" class="status" style="min-width:42px">0.00</span>
      <input id="sideSeek" type="range" min="0" max="1000" value="0" disabled style="flex:1">
      <span id="sideTimeTotal" class="status" style="min-width:42px;text-align:right">0.00</span>
    </div>
    <div id="sideResult" class="status">측면 카메라 연결 대기</div>`;
  frontPanel.insertAdjacentElement('afterend',side);

  byId('liveViewBtn')?.addEventListener('click',()=>{
    svShowLive();
    const st=byId('status');
    if(st && stream) st.textContent='LIVE · 다음 스윙 감지 대기';
  });

  byId('exitBtn')?.addEventListener('click',()=>{
    try{
      if(recorder && recorder.state==='recording') recorder.stop();
    }catch(e){}
    try{
      if(sideRecorder && sideRecorder.state==='recording') sideRecorder.stop();
    }catch(e){}
    try{
      if(stream) stream.getTracks().forEach(t=>t.stop());
    }catch(e){}
    try{
      if(sideStream) sideStream.getTracks().forEach(t=>t.stop());
    }catch(e){}

    stream=null;
    sideStream=null;
    try{ raw.srcObject=null; }catch(e){}

    // 회원카드에서 팝업으로 연 경우 정상적으로 닫힘
    if(window.opener && !window.opener.closed){
      window.close();
      return;
    }

    // 일반 브라우저 탭은 보안상 window.close()가 차단될 수 있음
    document.body.innerHTML =
      '<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#07140f;color:#fff;font-family:Arial,sans-serif">' +
      '<div style="text-align:center"><div style="font-size:28px;font-weight:900;margin-bottom:10px">SV 종료</div>' +
      '<div style="font-size:15px;color:#bdd0c6">카메라 연결을 종료했습니다. 이 탭을 닫아도 됩니다.</div></div></div>';
  });


  /* ---------- 카메라 선택 바: 정면 + 측면 ---------- */
  const controls=livePanel.querySelector('.controls');
  if(controls && !byId('sideCameraSelect')){
    const frontTag=document.createElement('span');
    frontTag.className='camTag';
    frontTag.textContent='정면';
    controls.insertBefore(frontTag,controls.firstChild);

    const sideTag=document.createElement('span');
    sideTag.className='camTag';
    sideTag.id='sideCamUiTag';
    sideTag.textContent='측면';

    const sideSelect=document.createElement('select');
    sideSelect.id='sideCameraSelect';
    sideSelect.className='white';
    sideSelect.title='측면 카메라 선택';
    sideSelect.innerHTML='<option value="">측면 카메라 선택</option>';

    const connect=byId('connect');
    controls.insertBefore(sideTag,connect);
    controls.insertBefore(sideSelect,connect);
  }

  let sideStream=null;
  let sideRecorder=null;

  function applyCameraLayout(){
    const wrap=document.querySelector('.wrap');
    if(!wrap) return;
    wrap.classList.toggle('dual-camera-active',!!sideStream);
  }
  window.addEventListener('resize',applyCameraLayout);

  let sideChunks=[];
  let latestSideBlob=null;

  const sideReplay=byId('sideReplay');
  const sideCanvas=byId('sideReplayCanvas');
  const sideCtx=sideCanvas.getContext('2d');
  const frontJointCanvas=byId('frontJointCanvas');
  const sideJointCanvas=byId('sideJointCanvas');

  let frontJointOn=false, sideJointOn=false;
  let frontReplayPose=null, sideReplayPose=null;
  let frontPoseBusy=false, sidePoseBusy=false;
  let frontLastPoseAt=0, sideLastPoseAt=0;

  async function refreshSideCameraList(){
    try{
      const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
      const sel=byId('sideCameraSelect');
      const wrap=document.querySelector('.wrap');
      if(!sel||!wrap) return;

      const old=sel.value;
      const frontId=byId('cameraSelect')?.value||'';

      sel.innerHTML='<option value="">측면 카메라 선택</option>';
      devices.forEach((d,i)=>{
        const o=document.createElement('option');
        o.value=d.deviceId;
        o.textContent=d.label||('카메라 '+(i+1));
        sel.appendChild(o);
      });

      // 실제 비디오 입력이 2개 이상 보이면 CAM2 사용 가능 상태
      wrap.classList.toggle('side-camera-available',devices.length>=2 && !window.matchMedia('(max-width:620px)').matches);

      if([...sel.options].some(o=>o.value===old)){
        sel.value=old;
      }else{
        sel.value='';
      }

      // 장치가 1개뿐이면 측면 연결/패널을 자동 해제
      if(devices.length<2){
        if(sideStream) sideStream.getTracks().forEach(t=>t.stop());
        sideStream=null;
        wrap.classList.remove('dual-camera-active');
        byId('sideResult').textContent='카메라 1대 · 정면 리플레이 전체화면';
      }
    }catch(e){}
  }
  refreshSideCameraList();
  if(navigator.mediaDevices?.addEventListener) navigator.mediaDevices.addEventListener('devicechange',refreshSideCameraList);

  async function connectSideCamera(){
    const wrap=document.querySelector('.wrap');
    const sel=byId('sideCameraSelect');
    if(!wrap||!sel) return false;

    // 휴대폰은 전/후면 카메라가 여러 개로 열거되는 경우가 많다.
    // 폰에서는 자동 CAM2 연결을 하지 않고 1화면을 기본 유지한다.
    if(window.matchMedia('(max-width:620px)').matches){
      wrap.classList.remove('dual-camera-active');
      byId('sideResult').textContent='모바일 · 정면 리플레이 1화면';
      return false;
    }

    // 정면 카메라가 실제로 연결될 때까지 기다린 후 실제 deviceId를 읽는다.
    const frontTrack=stream?.getVideoTracks?.()[0];
    const actualFrontId=frontTrack?.getSettings?.().deviceId || byId('cameraSelect')?.value || '';

    await refreshSideCameraList();

    const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    if(devices.length<2){
      wrap.classList.remove('dual-camera-active');
      byId('sideResult').textContent='카메라 1대 · 정면 리플레이 전체화면';
      return false;
    }

    // 실제 정면 장치와 다른 장치를 CAM2로 선택.
    let id=sel.value;
    if(!id || id===actualFrontId){
      const candidate=devices.find(d=>d.deviceId && d.deviceId!==actualFrontId);
      id=candidate?.deviceId||'';
      if(id) sel.value=id;
    }

    if(!id || id===actualFrontId){
      wrap.classList.remove('dual-camera-active');
      byId('sideResult').textContent='별도 CAM2 없음 · 정면 리플레이 전체화면';
      return false;
    }

    if(sideStream) sideStream.getTracks().forEach(t=>t.stop());

    try{
      sideStream=await navigator.mediaDevices.getUserMedia({
        video:{deviceId:{exact:id},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}},
        audio:false
      });

      const sideTrack=sideStream.getVideoTracks()[0];
      const actualSideId=sideTrack?.getSettings?.().deviceId||id;

      // 브라우저가 같은 장치를 다시 준 경우 2카메라로 인정하지 않는다.
      if(actualFrontId && actualSideId===actualFrontId){
        sideStream.getTracks().forEach(t=>t.stop());
        sideStream=null;
        wrap.classList.remove('dual-camera-active');
        byId('sideResult').textContent='CAM2 미확인 · 정면 리플레이 전체화면';
        return false;
      }

      wrap.classList.add('dual-camera-active');
      byId('sideResult').textContent='CAM2 연결 확인 · 정면/측면 50:50 자동 전환';
      return true;
    }catch(e){
      sideStream=null;
      wrap.classList.remove('dual-camera-active');
      byId('sideResult').textContent='CAM2 연결 안됨 · 정면 리플레이 전체화면';
      return false;
    }
  }

  /* 카메라 연결 1회:
     정면 연결 완료를 확인한 뒤에만 CAM2 자동 연결을 시도 */
  byId('connect')?.addEventListener('click',async()=>{
    const wrap=document.querySelector('.wrap');
    if(wrap) wrap.classList.remove('dual-camera-active');

    // 최초 권한 팝업까지 고려해 최대 약 15초 동안 정면 스트림을 기다림.
    for(let i=0;i<60;i++){
      if(stream?.getVideoTracks?.().length && stream.getVideoTracks()[0].readyState==='live'){
        await connectSideCamera();
        return;
      }
      await new Promise(r=>setTimeout(r,250));
    }

    if(wrap) wrap.classList.remove('dual-camera-active');
  },true);

  /* ---------- 정면 트리거와 동시에 측면 녹화 ---------- */
  window.startSideRecording=function(){
    if(!sideStream || sideRecorder?.state==='recording') return;
    sideChunks=[];
    let opt={};
    if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) opt={mimeType:'video/webm;codecs=vp8'};
    else if(MediaRecorder.isTypeSupported('video/webm')) opt={mimeType:'video/webm'};
    sideRecorder=new MediaRecorder(sideStream,opt);
    sideRecorder.ondataavailable=e=>{ if(e.data.size) sideChunks.push(e.data); };
    sideRecorder.onstop=()=>{
      if(!sideChunks.length) return;
      latestSideBlob=new Blob(sideChunks,{type:sideRecorder.mimeType||'video/webm'});
      if(sideReplay.src) URL.revokeObjectURL(sideReplay.src);
      sideReplay.src=URL.createObjectURL(latestSideBlob);
      sideReplay.loop=true;
      sideReplay.muted=true;
      sideReplay.load();
      sideReplay.onloadedmetadata=()=>{
        ['sidePlay','sidePause','sideSendA','sideSendB','sideJointBtn','sideFrameBack','sideFrameNext','sideSpeed','sideRotateBtn','sideSeek']
          .forEach(id=>byId(id).disabled=false);
        byId('sideTimeTotal').textContent=(sideReplay.duration||0).toFixed(2);
        sideReplay.currentTime=0;
        sideReplay.playbackRate=window.svGetAutoReplaySpeed?window.svGetAutoReplaySpeed():0.5;
        sideReplay.play().catch(()=>{});
        byId('sideResult').textContent='최근 측면 스윙 · 정면과 동시 촬영 완료';
      };
    };
    sideRecorder.start(100);
    setTimeout(()=>{
      if(sideRecorder && sideRecorder.state==='recording') sideRecorder.stop();
    },3200);
  };

  /* ---------- 측면 리플레이: cover + 원본비율 유지 ---------- */
  function drawSideReplay(){
    if(sideReplay.videoWidth && sideReplay.readyState>=2){
      const r=sideCanvas.getBoundingClientRect();
      const cw=Math.max(1,Math.round(r.width)),ch=Math.max(1,Math.round(r.height));
      if(sideCanvas.width!==cw||sideCanvas.height!==ch){
        sideCanvas.width=cw;sideCanvas.height=ch;
      }
      sideCtx.clearRect(0,0,cw,ch);

      const deg=(window.svSideRotation??90)%360;
      const rotated=(deg===90||deg===270);
      const sw=sideReplay.videoWidth, sh=sideReplay.videoHeight;
      const outW=rotated?sh:sw, outH=rotated?sw:sh;

      // 원본 종횡비 유지 + 영상 전체 표시 + 크롭/늘어남 금지
      const scale=Math.min(cw/outW,ch/outH);

      sideCtx.save();
      sideCtx.translate(cw/2,ch/2);
      sideCtx.rotate(deg*Math.PI/180);
      sideCtx.drawImage(sideReplay,-sw*scale/2,-sh*scale/2,sw*scale,sh*scale);
      sideCtx.restore();
    }
    requestAnimationFrame(drawSideReplay);
  }
  drawSideReplay();

  /* ---------- 재생/프레임/배속 ---------- */
  byId('sidePlay').onclick=()=>sideReplay.play().catch(()=>{});
  byId('sidePause').onclick=()=>sideReplay.pause();
  byId('sideFrameBack').onclick=()=>{sideReplay.pause();sideReplay.currentTime=Math.max(0,sideReplay.currentTime-1/30);};
  byId('sideFrameNext').onclick=()=>{sideReplay.pause();sideReplay.currentTime=Math.min(sideReplay.duration||0,sideReplay.currentTime+1/30);};
  byId('sideSpeed').onchange=e=>{sideReplay.playbackRate=Number(e.target.value)||1;};
  byId('sideSeek').oninput=e=>{
    if(isFinite(sideReplay.duration)&&sideReplay.duration>0)
      sideReplay.currentTime=(Number(e.target.value)/1000)*sideReplay.duration;
  };
  sideReplay.addEventListener('timeupdate',()=>{
    byId('sideTimeNow').textContent=(sideReplay.currentTime||0).toFixed(2);
    if(isFinite(sideReplay.duration)&&sideReplay.duration>0){
      byId('sideSeek').value=Math.round((sideReplay.currentTime/sideReplay.duration)*1000);
      byId('sideTimeTotal').textContent=sideReplay.duration.toFixed(2);
    }
  });

  /* ---------- A/B 전송: 정면/측면 모두 각각 2개 ---------- */
  function sendSide(slot){
    if(!latestSideBlob){byId('sideResult').textContent='보낼 측면 영상이 없습니다.';return;}
    const target=(window.opener&&!window.opener.closed)?window.opener:null;
    if(!target){byId('sideResult').textContent='회원카드의 SV 촬영 버튼으로 열어야 전송됩니다.';return;}
    try{
      target.postMessage({type:'TUP_SV_VIDEO',slot,blob:latestSideBlob,rotation:90,view:'SIDE',createdAt:Date.now()},'*');
      byId('sideResult').textContent='✓ 측면 → '+slot+'화면 전송 완료';
    }catch(e){byId('sideResult').textContent='전송 실패: '+e.message;}
  }
  byId('sideSendA').onclick=()=>sendSide('A');
  byId('sideSendB').onclick=()=>sendSide('B');

  /* ---------- 영상회전: 정면/측면 독립 ---------- */
  window.svFrontRotation=90;
  window.svSideRotation=90;

  function clearJointCanvas(which){
    const c=byId(which==='front'?'frontJointCanvas':'sideJointCanvas');
    if(c){
      const x=c.getContext('2d');
      x.clearRect(0,0,c.width,c.height);
    }
  }

  byId('frontRotateBtn').onclick=()=>{
    window.svFrontRotation=(window.svFrontRotation+90)%360;
    byId('frontRotateBtn').textContent='영상회전 '+window.svFrontRotation+'°';
    resetReplayTrails('front');
    clearJointCanvas('front');
  };

  byId('sideRotateBtn').onclick=()=>{
    window.svSideRotation=(window.svSideRotation+90)%360;
    byId('sideRotateBtn').textContent='영상회전 '+window.svSideRotation+'°';
    resetReplayTrails('side');
    clearJointCanvas('side');
  };

  /* ---------- 관절보기: 정면/측면 독립 ON/OFF ---------- */
  function ensurePose(which){
    const isFront=which==='front';
    if(isFront && frontReplayPose) return frontReplayPose;
    if(!isFront && sideReplayPose) return sideReplayPose;
    const p=new Pose({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    p.setOptions({
      modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,
      minDetectionConfidence:0.45,minTrackingConfidence:0.45
    });
    p.onResults(res=>drawReplayJoints(which,res.poseLandmarks||null));
    if(isFront) frontReplayPose=p; else sideReplayPose=p;
    return p;
  }

  // Replay trails are built exclusively from observed MediaPipe landmarks.
  const replayTrailData={front:{13:[],14:[],15:[],16:[]},side:{13:[],14:[],15:[],16:[]}};
  const replayTrailLastTime={front:-1,side:-1};
  function resetReplayTrails(which){
    for(const i of [13,14,15,16])replayTrailData[which][i].length=0;
    replayTrailLastTime[which]=-1;
  }
  function drawReplayJoints(which,lm){
    const c=which==='front'?frontJointCanvas:sideJointCanvas;
    const stage=which==='front'?frontStage:byId('sideVideoStage');
    const video=which==='front'?byId('replay'):sideReplay;
    if(!c||!stage||!video)return;
    const r=stage.getBoundingClientRect();
    const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
    if(c.width!==w||c.height!==h){c.width=w;c.height=h;resetReplayTrails(which);}
    const x=c.getContext('2d');
    x.clearRect(0,0,w,h);
    const time=video.currentTime||0;
    if(replayTrailLastTime[which]>=0 && time<replayTrailLastTime[which]-.06)resetReplayTrails(which);
    if(!lm){
      for(const i of [13,14,15,16]){
        const hist=replayTrailData[which][i];
        if(!hist.length||Math.abs(time-hist[hist.length-1].t)>.008)hist.push({t:time,valid:false});
        if(hist.length>1200)hist.shift();
      }
      replayTrailLastTime[which]=time;
      return;
    }
    replayTrailLastTime[which]=time;
    // Match the video's contain-fit image area, not the whole stage.
    const inputW=(which==='front'?frontJointInput:sideJointInput).width;
    const inputH=(which==='front'?frontJointInput:sideJointInput).height;
    const scale=Math.min(w/inputW,h/inputH);
    const imageX=(w-inputW*scale)/2,imageY=(h-inputH*scale)/2;
    const specs=[
      {i:13,rgb:'255,218,38',alpha:.38,width:1.1,radius:2.6},
      {i:14,rgb:'255,218,38',alpha:.38,width:1.1,radius:2.6},
      {i:15,rgb:'255,55,55',alpha:.95,width:1.5,radius:3},
      {i:16,rgb:'255,55,55',alpha:.95,width:1.5,radius:3}
    ];
    for(const spec of specs){
      const p=lm[spec.i],history=replayTrailData[which][spec.i];
      const valid=p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&(p.visibility??1)>=.55;
      // Skip duplicate video timestamps, including pause frames.
      if(history.length===0||Math.abs(time-history[history.length-1].t)>.008){
        history.push(valid?{x:imageX+p.x*inputW*scale,y:imageY+p.y*inputH*scale,t:time,valid:true}:{t:time,valid:false});
        if(history.length>1200)history.shift();
      }
      x.save();x.lineWidth=spec.width;x.strokeStyle='rgba('+spec.rgb+','+spec.alpha+')';
      x.beginPath();let started=false;
      for(const point of history){
        if(!point.valid){started=false;continue;}
        if(!started){x.moveTo(point.x,point.y);started=true;}
        else x.lineTo(point.x,point.y);
      }
      x.stroke();
      if(valid){
        x.fillStyle='rgba('+spec.rgb+','+(spec.i>=15?1:.48)+')';
        x.beginPath();x.arc(imageX+p.x*inputW*scale,imageY+p.y*inputH*scale,spec.radius,0,Math.PI*2);x.fill();
      }
      x.restore();
    }
  }

  const frontJointInput=document.createElement('canvas');
  const frontJointCtx=frontJointInput.getContext('2d');
  const sideJointInput=document.createElement('canvas');
  const sideJointCtx=sideJointInput.getContext('2d');

  async function processReplayPose(which){
    const isFront=which==='front';
    const video=isFront?byId('replay'):sideReplay;
    const input=isFront?frontJointInput:sideJointInput;
    const ictx=isFront?frontJointCtx:sideJointCtx;
    if(!video||video.readyState<2||!video.videoWidth||!video.videoHeight) return;

    const deg=(isFront?window.svFrontRotation:window.svSideRotation)??90;
    const rotated=(deg===90||deg===270);

    input.width=rotated?video.videoHeight:video.videoWidth;
    input.height=rotated?video.videoWidth:video.videoHeight;

    ictx.setTransform(1,0,0,1,0,0);
    ictx.clearRect(0,0,input.width,input.height);
    ictx.translate(input.width/2,input.height/2);
    ictx.rotate(deg*Math.PI/180);
    ictx.drawImage(video,-video.videoWidth/2,-video.videoHeight/2);
    ictx.setTransform(1,0,0,1,0,0);

    await ensurePose(which).send({image:input});
  }

  async function jointLoop(){
    const now=performance.now();
    if(frontJointOn && !frontPoseBusy && now-frontLastPoseAt>90){
      frontPoseBusy=true;frontLastPoseAt=now;
      try{await processReplayPose('front');}catch(e){}finally{frontPoseBusy=false;}
    }
    if(sideJointOn && !sidePoseBusy && now-sideLastPoseAt>90){
      sidePoseBusy=true;sideLastPoseAt=now;
      try{await processReplayPose('side');}catch(e){}finally{sidePoseBusy=false;}
    }
    requestAnimationFrame(jointLoop);
  }
  jointLoop();

  for(const [which,video] of [['front',byId('replay')],['side',sideReplay]]){
    if(!video)continue;
    for(const event of ['seeking','loadedmetadata','emptied']){
      video.addEventListener(event,()=>{resetReplayTrails(which);clearJointCanvas(which);});
    }
  }
  function clearJoint(which){
    const c=which==='front'?frontJointCanvas:sideJointCanvas;
    if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);
  }

  byId('frontJointBtn').onclick=()=>{
    frontJointOn=!frontJointOn;
    byId('frontJointBtn').textContent='관절보기 '+(frontJointOn?'ON':'OFF');
    byId('frontJointBtn').classList.toggle('jointOn',frontJointOn);
    resetReplayTrails('front');
    if(!frontJointOn) clearJoint('front');
  };
  byId('sideJointBtn').onclick=()=>{
    sideJointOn=!sideJointOn;
    byId('sideJointBtn').textContent='관절보기 '+(sideJointOn?'ON':'OFF');
    byId('sideJointBtn').classList.toggle('jointOn',sideJointOn);
    resetReplayTrails('side');
    if(!sideJointOn) clearJoint('side');
  };

  /* 해제 시 측면도 같이 종료 */
  byId('disconnect')?.addEventListener('click',()=>{
    if(sideRecorder&&sideRecorder.state==='recording') sideRecorder.stop();
    if(sideStream) sideStream.getTracks().forEach(t=>t.stop());
    sideStream=null;
    document.querySelector('.wrap')?.classList.remove('dual-camera-active');
    byId('sideResult').textContent='CAM2 해제 · 정면 리플레이 전체화면';
  },true);
})();
</script>

<script id="svMobileManualSaveScript">
(()=>{
 'use strict';
 const panel=document.getElementById('svReplayPanel');
 const controls=panel?.querySelector('.controls');
 const replayVideo=document.getElementById('replay');
 if(!controls||!replayVideo)return;
 const bar=document.createElement('div');bar.id='svMobileSaveBar';
 const saveBtn=document.createElement('button');saveBtn.type='button';saveBtn.id='svMobileSaveBtn';saveBtn.textContent='촬영 영상 저장';saveBtn.disabled=true;
 const status=document.createElement('span');status.id='svMobileSaveStatus';status.textContent='스윙 촬영 후 저장할 수 있습니다.';
 bar.append(saveBtn,status);
 const libraryBar=document.getElementById('svMobileLibraryBar');
 if(libraryBar)libraryBar.insertAdjacentElement('afterend',bar);
 else controls.parentElement.insertBefore(bar,controls);
 const getRecordedBlob=()=> (typeof latestReplayBlob!=='undefined' && latestReplayBlob instanceof Blob && latestReplayBlob.size>0)?latestReplayBlob:null;
 const update=()=>{saveBtn.disabled=!getRecordedBlob();};
 replayVideo.addEventListener('loadedmetadata',()=>{
   update();
   if(getRecordedBlob())status.textContent='촬영 완료 · 저장 버튼을 눌러 파일로 보관하세요.';
   else status.textContent='내 동영상 재생 중 · 저장은 새로 촬영한 영상에만 적용됩니다.';
 });
 saveBtn.addEventListener('click',async()=>{
   const blob=getRecordedBlob();if(!blob){status.textContent='저장할 촬영 영상이 없습니다.';update();return;}
   const mime=blob.type.toLowerCase();
   const ext=mime.includes('mp4')?'mp4':mime.includes('quicktime')?'mov':'webm';
   const stamp=new Date();
   const filename='TUP_SV_'+stamp.getFullYear()+String(stamp.getMonth()+1).padStart(2,'0')+String(stamp.getDate()).padStart(2,'0')+'_'+String(stamp.getHours()).padStart(2,'0')+String(stamp.getMinutes()).padStart(2,'0')+String(stamp.getSeconds()).padStart(2,'0')+'.'+ext;
   try{
     if(navigator.canShare && navigator.share){
       const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
       if(navigator.canShare({files:[file]})){
         try{await navigator.share({files:[file],title:'SV 스윙 영상'});status.textContent='공유/파일 저장 메뉴를 실행했습니다. 저장 위치를 확인하세요.';return;}
         catch(err){if(err.name==='AbortError'){status.textContent='저장이 취소되었습니다.';return;}}
       }
     }
     const url=URL.createObjectURL(blob);
     const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
     status.textContent='다운로드를 요청했습니다. 휴대폰의 파일/다운로드 폴더를 확인하세요.';
     setTimeout(()=>URL.revokeObjectURL(url),60000);
   }catch(err){status.textContent='저장 요청 실패: '+(err?.message||String(err));}
 });
 update();
})();
</script>

<script>
/* SV MOBILE V2: independent, non-destructive manual annotations. */
(()=>{
 const stage=document.getElementById('mainVideoStage'),panel=document.getElementById('svReplayPanel');
 if(!stage||!panel||document.getElementById('svDrawOverlay'))return;
 const overlay=document.createElement('canvas');overlay.id='svDrawOverlay';stage.appendChild(overlay);
 const bar=document.createElement('div');bar.id='svDrawBar';
 bar.innerHTML='<button type="button" data-mode="free">자유선</button><button type="button" data-mode="line">직선</button><button type="button" data-mode="circle">원</button><button type="button" data-mode="angle">각도 3점</button><button type="button" data-mode="move">선택·이동</button><button type="button" data-mode="off" class="active">그리기 OFF</button><input type="color" id="svDrawColor" value="#f5d86a" aria-label="선 색상"><button type="button" id="svDrawUndo">되돌리기</button><button type="button" id="svDrawClear">전체 삭제</button><span id="svDrawInfo">영상을 정지한 뒤 직선·원·각도를 선택하세요.</span>';
 document.body.appendChild(bar); // toolbar must remain visible when replay panel is hidden in LIVE mode
 const info=document.getElementById('svDrawInfo'),ctx=overlay.getContext('2d');
 let mode='off',shapes=[],anglePoints=[],dragStart=null,dragEnd=null,ink='#f5d86a';
 let selected=-1,moveStart=null,moveOriginal=null,moveHandle=-1,freePoints=null;
 const norm=(e)=>{const r=overlay.getBoundingClientRect();return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}};
 const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
 function paint(){
  const r=overlay.getBoundingClientRect(),w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  if(overlay.width!==w||overlay.height!==h){overlay.width=w;overlay.height=h;}
  ctx.clearRect(0,0,w,h);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  const xy=p=>({x:p.x*w,y:p.y*h});
  function draw(shape){
   ctx.strokeStyle=shape.color;ctx.fillStyle=shape.color;
   if(shape.type==='free'){const pts=shape.points.map(xy);if(!pts.length)return;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}else if(shape.type==='line'||shape.type==='circle'){
    const a=xy(shape.a),b=xy(shape.b);ctx.beginPath();
    if(shape.type==='line'){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}
    else ctx.arc(a.x,a.y,Math.hypot(b.x-a.x,b.y-a.y),0,Math.PI*2);
    ctx.stroke();
   } else if(shape.type==='angle'){
    const [a,b,c]=shape.points.map(xy);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.stroke();
    const v1={x:a.x-b.x,y:a.y-b.y},v2={x:c.x-b.x,y:c.y-b.y};
    const l1=Math.hypot(v1.x,v1.y),l2=Math.hypot(v2.x,v2.y);
    if(l1<5||l2<5)return;
    const cosine=Math.max(-1,Math.min(1,(v1.x*v2.x+v1.y*v2.y)/(l1*l2)));
    const deg=Math.acos(cosine)*180/Math.PI;
    const tx=b.x+(v1.x/l1+v2.x/l2)*25,ty=b.y+(v1.y/l1+v2.y/l2)*25;
    ctx.font='bold 17px sans-serif';ctx.lineWidth=4;ctx.strokeStyle='#07130d';ctx.strokeText(deg.toFixed(1)+'°',tx,ty);ctx.fillText(deg.toFixed(1)+'°',tx,ty);ctx.lineWidth=3;
    for(const pt of [a,b,c]){ctx.beginPath();ctx.arc(pt.x,pt.y,4,0,Math.PI*2);ctx.fill();}
   }
  }
