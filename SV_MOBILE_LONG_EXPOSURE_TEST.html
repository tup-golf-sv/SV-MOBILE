<script id="svCameraRotateControlScript">
(()=>{
 const init=()=>{
  const bar=document.getElementById('svFloatingCamera');
  const raw=document.getElementById('raw');
  const stage=document.getElementById('liveStage');
  const joints=document.getElementById('view');
  if(!bar||!raw||!stage||document.getElementById('svCameraRotateBtn'))return;
  const btn=document.createElement('button');
  btn.type='button';btn.id='svCameraRotateBtn';btn.textContent='↻ 90°';btn.title='카메라 영상과 관절 표시를 함께 90도씩 회전';
  const select=document.getElementById('cameraSelect');
  if(select)select.insertAdjacentElement('afterend',btn);else bar.appendChild(btn);
  let angle=90;
  function apply(){
   const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
   const quarter=angle%180!==0;
   raw.style.setProperty('width',(quarter?h:w)+'px','important');
   raw.style.setProperty('height',(quarter?w:h)+'px','important');
   raw.style.setProperty('transform','translate(-50%,-50%) rotate('+angle+'deg)','important');
   // Joint coordinates are projected per-frame in drawSkeleton; never CSS-rotate the canvas.
   window.svPreviewRotationDeg=angle;
   if(joints){
    joints.style.setProperty('transform','none','important');
    joints.style.setProperty('transform-origin','center center','important');
   }
   btn.textContent='↻ '+angle+'°';
  }
  btn.addEventListener('click',()=>{angle=(angle+90)%360;apply()});
  window.addEventListener('resize',apply);
  raw.addEventListener('loadedmetadata',apply);
  new ResizeObserver(apply).observe(stage);
  apply();
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

<script id="svFocusABScript">
(()=>{
const init=()=>{
 const panel=document.createElement('div');
 panel.id='svFocusAB';panel.className='svFocusCollapsed';
 panel.innerHTML='<button id="svFocusToggle" type="button">AF 진단 ▸</button><div class="svFocusRow"><button id="svFocusProbe" type="button">지원 확인</button><button id="svFocusAuto" type="button">자동초점</button><button id="svFocusLock" type="button">초점 고정</button><button id="svFocusClear" type="button">비교 초기화</button><button id="svFocusCopy" type="button">결과 복사</button></div><pre id="svFocusInfo">카메라 연결 후 지원 확인</pre>';
 document.body.appendChild(panel);
 const get=id=>document.getElementById(id);
 const info=get('svFocusInfo');
 let mode='미확인',supported='미확인',message='카메라 연결 후 지원 확인';
 const sessions={auto:{n:0,eligible:0,stable:0,pelvis:0,ankle:0},manual:{n:0,eligible:0,stable:0,pelvis:0,ankle:0}};
 let lastSamples=0,lastTrack=null,lastMode=null;
 const track=()=>document.getElementById('raw')?.srcObject?.getVideoTracks?.()[0]||null;
 const caps=t=>{try{return t?.getCapabilities?.()||{}}catch(e){return {}}};
 const settings=t=>{try{return t?.getSettings?.()||{}}catch(e){return {}}};
 const fm=v=>Number.isFinite(v)?v.toFixed(3):'—';
 const row=(key,name)=>{const x=sessions[key];return name+' '+x.n+'프레임 · 동시통과 '+x.eligible+' · 안정도 '+(x.n?fm(x.stable/x.n):'—')+' · 골반 '+(x.n?fm(x.pelvis/x.n):'—')+' · 발목 '+(x.n?fm(x.ankle/x.n):'—')};
 const render=()=>{
  const t=track(),c=caps(t),st=settings(t);
  const active=st.focusMode||'미노출';
  info.textContent='초점 제어 '+supported+' · 선택 '+mode+' · 실제설정 '+active+
   '\n지원 모드 '+(Array.isArray(c.focusMode)?c.focusMode.join(', '):'정보 없음')+
   '\n초점거리 '+(Number.isFinite(st.focusDistance)?st.focusDistance:'미노출')+
   '\n'+message+'\n'+row('auto','AUTO')+'\n'+row('manual','LOCK')+
   '\n※ 평균은 기록 프레임 기준, 동일 자세·거리로 비교';
 };
 get('svFocusToggle').onclick=()=>{panel.classList.toggle('svFocusCollapsed');get('svFocusToggle').textContent=panel.classList.contains('svFocusCollapsed')?'AF 진단 ▸':'AF 진단 ▾';render()};
 get('svFocusProbe').onclick=()=>{
  const t=track();if(!t){message='카메라 미연결';render();return}
  const c=caps(t);
  supported=Array.isArray(c.focusMode)?c.focusMode.join('/'):'초점 모드 제어 미노출';
  message='지원 기능 조회 완료 (초점은 변경하지 않음)';
  render();
 };
 const setMode=async target=>{
  const t=track();if(!t){message='카메라 미연결';render();return}
  const c=caps(t),options=Array.isArray(c.focusMode)?c.focusMode:[];
  supported=options.length?options.join('/'):'초점 모드 제어 미지원';
  if(!options.includes(target)){message=target+' 미지원 · 기존 초점 유지';render();return}
  const before=t.getConstraints?.()||{};
  try{
   // Preserve the current video constraints; modify only focus mode.
   await t.applyConstraints({...before,advanced:[...(before.advanced||[]),{focusMode:target}]});
   const actual=settings(t).focusMode;
   if(actual!==target){message='적용 요청 후 실제 초점모드 확인 불가/불일치: '+(actual||'미노출');mode='미확인'}
   else{mode=target==='continuous'?'auto':'manual';message='적용 확인: '+target}
  }catch(e){message='초점 변경 실패: '+(e?.name||'Error');}
  render();
 };
 get('svFocusAuto').onclick=()=>setMode('continuous');
 get('svFocusLock').onclick=()=>setMode('manual');
 get('svFocusClear').onclick=()=>{for(const x of Object.values(sessions)){x.n=0;x.eligible=0;x.stable=0;x.pelvis=0;x.ankle=0}lastSamples=window.svAddressHistory?.samples||0;message='비교 기록 초기화';render()};
 get('svFocusCopy').onclick=()=>{
  const t=track();const report='SV MOBILE 초점 A/B 진단\n'+info.textContent+'\n'+row('auto','AUTO')+'\n'+row('manual','LOCK');
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(report).then(()=>{message='복사 완료';render()}).catch(()=>{message='복사 실패';render()});
 };
 // Observe read-only diagnostic samples; never affect READY thresholds.
 setInterval(()=>{
  const t=track();if(t!==lastTrack){lastTrack=t;mode='미확인';supported='미확인';lastSamples=window.svAddressHistory?.samples||0;message=t?'새 카메라 연결됨 · 지원 확인 필요':'카메라 미연결';render()}
  const h=window.svAddressHistory;
  if(!h||!t)return;
  if(h.samples<lastSamples)lastSamples=h.samples;
  if(h.samples===lastSamples)return;
  lastSamples=h.samples;
  if(mode!=='auto'&&mode!=='manual')return;
  const snap=h.last;
  if(!snap||!snap.metrics)return;
  const x=sessions[mode],m=snap.metrics;
  if(![m.stability,m.pelvisSpeed,m.ankleSpeed].every(Number.isFinite))return;
  x.n++;x.stable+=m.stability;x.pelvis+=m.pelvisSpeed;x.ankle+=m.ankleSpeed;
  if(snap.eligible)x.eligible++;
  if(!panel.classList.contains('svFocusCollapsed'))render();
 },250);
 render();
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

body>#speedMenu .speedChoice{min-height:36px!important;white-space:nowrap!important}
</style>
<script id="svSpeedMenuPortalFix">
(()=>{
 const init=()=>{
  const button=document.getElementById('speedMenuBtn');
  const menu=document.getElementById('speedMenu');
  if(!button||!menu)return;
  // Preserve existing button and choice handlers. Move only the menu to avoid
  // clipping by the replay toolbar's overflow-x:auto.
  document.body.appendChild(menu);
  const position=()=>{
   const r=button.getBoundingClientRect();
   const w=window.visualViewport?.width||window.innerWidth;
   const h=window.visualViewport?.height||window.innerHeight;
   const mw=menu.offsetWidth||104;
   const mh=menu.offsetHeight||240;
   const x=Math.max(6,Math.min(w-mw-6,r.right-mw));
   const y=Math.max(6,Math.min(h-mh-6,r.top-mh-6));
   menu.style.setProperty('left',Math.round(x)+'px','important');
   menu.style.setProperty('top',Math.round(y)+'px','important');
  };
  button.addEventListener('click',()=>{
   if(menu.style.display!=='none')position();
  });
  window.addEventListener('resize',()=>{if(menu.style.display!=='none')position()});
  window.visualViewport?.addEventListener('resize',()=>{if(menu.style.display!=='none')position()});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
 else init();
})();
</script>

<style id="svTrailToggleStyle">
#svTrailToggle{height:32px;min-height:32px;padding:3px 9px;border-radius:8px;border:1px solid #628c80;
background:#34493f;color:#fff;font:700 12px Arial,sans-serif;white-space:nowrap}
#svTrailToggle[aria-pressed="true"]{background:#176b78;border-color:#6ad7eb;color:#eaffff}
</style>
<script id="svTrailToggleScript">
(()=>{
 const init=()=>{
  const bar=document.getElementById('svFloatingReplay')||
            document.getElementById('replayPlay')?.parentElement;
  if(!bar||document.getElementById('svTrailToggle'))return;
  const btn=document.createElement('button');
  btn.id='svTrailToggle';btn.type='button';
  btn.textContent='궤적보기 OFF';btn.setAttribute('aria-pressed','false');
  btn.title='클럽헤드 궤적 표시 설정 (자동 검출 기능 준비 중)';
  window.svClubTrailVisible=false;
  btn.addEventListener('click',()=>{
    window.svClubTrailVisible=!window.svClubTrailVisible;
    btn.setAttribute('aria-pressed',String(window.svClubTrailVisible));
    btn.textContent='궤적보기 '+(window.svClubTrailVisible?'ON':'OFF');
    document.dispatchEvent(new CustomEvent('sv-club-trail-visibility',{detail:{visible:window.svClubTrailVisible}}));
  });
  const anchor=document.getElementById('frontJointBtn');
  if(anchor&&anchor.parentElement===bar)anchor.insertAdjacentElement('afterend',btn);
  else bar.appendChild(btn);
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
 else init();
})();
</script>
<script id="svAutoReplaySpeedIndependent">
(()=>{
const allowed=new Set(['0.1','0.25','0.5','0.75','1']);
let speed='0.5';
try{const saved=localStorage.getItem('sv_mobile_auto_replay_speed');if(allowed.has(saved))speed=saved;}catch(e){}
window.svGetAutoReplaySpeed=()=>Number(speed);
const init=()=>{const el=document.getElementById('svAutoReplaySpeed');if(!el)return;el.value=speed;el.addEventListener('change',()=>{if(!allowed.has(el.value))return;speed=el.value;try{localStorage.setItem('sv_mobile_auto_replay_speed',speed);}catch(e){};});};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
<script id="svEqualReplayButtonWidths">
(()=>{
 const sync=()=>{
  const bar=document.getElementById('svFloatingReplay');
  const joint=document.getElementById('frontJointBtn');
  if(!bar||!joint||joint.parentElement!==bar)return;
  // The joint button retains its native measured width; other visible controls match it.
  const width=joint.getBoundingClientRect().width;
  if(!Number.isFinite(width)||width<40)return;
  ['svTrailToggle','replayPause','replayPlay'].forEach(id=>{
   const button=document.getElementById(id);
   if(!button||button.parentElement!==bar)return;
   const w=width+'px';
   button.style.setProperty('width',w,'important');
   button.style.setProperty('min-width',w,'important');
   button.style.setProperty('max-width',w,'important');
   button.style.setProperty('flex','0 0 '+w,'important');
   button.style.setProperty('box-sizing','border-box','important');
  });
 };
 const init=()=>{
  sync();
  const joint=document.getElementById('frontJointBtn');
  if(joint&&typeof ResizeObserver!=='undefined')new ResizeObserver(sync).observe(joint);
  const bar=document.getElementById('svFloatingReplay');
  if(bar&&typeof MutationObserver!=='undefined')new MutationObserver(sync).observe(bar,{childList:true});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
