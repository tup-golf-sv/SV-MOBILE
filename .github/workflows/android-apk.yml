name: Android APK build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use installed Android SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0' 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test server entitlement enforcement
        run: |
          pip install -r server/requirements.txt
          python -m pytest server/tests -q
      - name: Compile APK, AAB and instrumentation tests
        working-directory: androidapp
        env:
          SV_API_BASE: ${{ vars.SV_API_BASE }}
          SV_FIREBASE_API_KEY: ${{ vars.SV_FIREBASE_API_KEY }}
        run: gradle --no-daemon assembleDebug bundleRelease assembleDebugAndroidTest lintDebug
      - name: Verify APK signature and original web source
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs androidapp/app/build/outputs/apk/debug/app-debug.apk
          cmp index.html androidapp/app/src/main/assets/index.html
          sha256sum androidapp/app/build/outputs/apk/debug/app-debug.apk > androidapp/app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sv-mobile-debug-apk
          path: |
            androidapp/app/build/outputs/apk/debug/*
            androidapp/app/build/outputs/apk/androidTest/debug/*.apk
            androidapp/app/build/outputs/bundle/release/*.aab
            androidapp/app/build/reports/lint-results-debug.html
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: sv-mobile-debug-apk
          path: androidapp/ci-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu host -feature -Vulkan -no-snapshot -memory 4096 -cores 4 -skin 480x800 -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          working-directory: androidapp
          script: bash ../scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-test-results
          path: |
            androidapp/android-evidence/
