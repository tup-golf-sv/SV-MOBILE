plugins { id 'com.android.application' }
android {
    namespace 'kr.co.tupgolf.svmobile'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.co.tupgolf.svmobile'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0-dev'
        buildConfigField 'String', 'API_BASE', '"' + (System.getenv('SV_API_BASE') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + (System.getenv('SV_FIREBASE_API_KEY') ?: '') + '"'
        buildConfigField 'String', 'PRO_PRODUCT', '"sv_mobile_pro"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.android.billingclient:billing:8.3.0'
}
// Package the existing web app byte-for-byte. Production index.html is never edited.
tasks.register('syncWebApp', Copy) {
    from rootProject.file('../index.html')
    from rootProject.file('../manifest.webmanifest')
    from rootProject.file('../sv-mobile-icon.svg')
    into 'src/main/assets'
}
preBuild.dependsOn syncWebApp
android.defaultConfig.testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
